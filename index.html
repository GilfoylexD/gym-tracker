        function hexToRgba(hex, alpha) {
            const value = String(hex).replace("#", "");
            if (value.length !== 6) return "rgba(59,130,246," + alpha + ")";
            const r = parseInt(value.slice(0, 2), 16);
            const g = parseInt(value.slice(2, 4), 16);
            const b = parseInt(value.slice(4, 6), 16);
            return "rgba(" + r + "," + g + "," + b + "," + alpha + ")";
        }

        const CHART_MODES = {
            avg: { label: "Средний вес (кг)", caption: "СРЕДНИЙ ВЕС (КГ) ПО ДНЯМ", tip: "Средний вес" },
            top: { label: "Лучший вес (кг)", caption: "ЛУЧШИЙ ВЕС (КГ) ПО ТРЕНИРОВКАМ", tip: "Лучший вес" },
            oneRM: { label: "Расчётный 1ПМ (кг)", caption: "РАСЧЁТНЫЙ 1ПМ (КГ) ПО ТРЕНИРОВКАМ", tip: "1ПМ" },
            volume: { label: "Объём (кг)", caption: "ОБЪЁМ (КГ) ПО ТРЕНИРОВКАМ", tip: "Объём" }
        };

        function buildChartSeries(canonical, mode) {
            const labels = [];
            const data = [];
            historyData.slice().reverse().forEach(function (workout) {
                const found = workout.exercises.find(function (ex) {
                    return canonicalName(ex.name) === canonical;
                });
                if (!found || !found.sets.length) return;

                let value = 0;
                let valid = false;

                if (mode === "avg") {
                    let total = 0;
                    let count = 0;
                    found.sets.forEach(function (set) {
                        const w = parseNum(set.weight);
                        if (isFinite(w) && w > 0) { total += w; count++; }
                    });
                    if (count) { value = total / count; valid = true; }
                } else if (mode === "top") {
                    found.sets.forEach(function (set) {
                        const w = parseNum(set.weight);
                        if (isFinite(w) && w > 0 && w > value) { value = w; valid = true; }
                    });
                } else if (mode === "oneRM") {
                    found.sets.forEach(function (set) {
                        const estimate = estimate1RM(set.weight, set.reps);
                        if (estimate > value) { value = estimate; valid = true; }
                    });
                } else if (mode === "volume") {
                    found.sets.forEach(function (set) {
                        const w = parseNum(set.weight);
                        const r = parseNum(set.reps);
                        if (isFinite(w) && isFinite(r) && w > 0 && r > 0) {
                            value += w * r;
                            valid = true;
                        }
                    });
                }

                if (!valid) return;
                let label = workout.shortDate;
                if (!label) {
                    const d = dateFromWorkout(workout);
                    label = d ? formatShortDate(d) : String(workout.date || "").split(" ").pop();
                }
                labels.push(label);
                data.push(parseFloat(value.toFixed(1)));
            });
            return { labels: labels, data: data };
        }

        function updateChartModeButtons() {
            document.querySelectorAll("#chart-modes .mode-btn").forEach(function (btn) {
                btn.classList.toggle("active", btn.dataset.mode === chartMode);
            });
        }

        function openChart(exerciseName) {
            chartExercise = canonicalName(exerciseName);
            chartMode = "avg";
            chartOrigin = currentScreenId() === "screen-analytics" ? "screen-analytics" : "screen-history";
            const title = document.getElementById("chart-title");
            if (title) title.textContent = chartExercise;
            updateChartModeButtons();

            const series = buildChartSeries(chartExercise, chartMode);
            if (!series.labels.length) {
                uiAlert("Недостаточно данных для построения графика.", "Нет данных");
                return;
            }
            showScreen("screen-chart");
            renderChart();
        }

        function closeChart() {
            showScreen(chartOrigin || "screen-history");
        }

        function setChartMode(mode) {
            if (!chartExercise || !CHART_MODES[mode]) return;
            chartMode = mode;
            updateChartModeButtons();
            renderChart();
        }

        function renderChart() {
            if (!chartExercise) return;
            if (typeof Chart === "undefined") {
                uiAlert("Не удалось загрузить библиотеку графиков. Проверь подключение к интернету.", "График недоступен");
                return;
            }

            const series = buildChartSeries(chartExercise, chartMode);
            if (!series.labels.length) {
                showToast("Для этого режима пока нет данных", "error");
                return;
            }

            const meta = CHART_MODES[chartMode];
            const subtitle = document.getElementById("chart-subtitle");
            const caption = document.getElementById("chart-caption");
            const best = getBests(chartExercise, false);
            if (subtitle) {
                subtitle.textContent = best.weight > 0
                    ? "Рекорд: " + displayNum(best.weight) + " кг · 1ПМ ≈ " + Math.round(best.oneRM) + " кг"
                    : "Статистика по тренировкам";
            }
            if (caption) caption.textContent = meta.caption;

            const canvas = document.getElementById("progressChart");
            if (!canvas) return;
            const ctx = canvas.getContext("2d");
            if (chartInstance) chartInstance.destroy();

            const color = GROUP_COLORS[groupOf(chartExercise)] || "#3b82f6";

            chartInstance = new Chart(ctx, {
                type: "line",
                data: {
                    labels: series.labels,
                    datasets: [{
                        label: meta.label,
                        data: series.data,
                        borderColor: color,
                        backgroundColor: hexToRgba(color, 0.12),
                        borderWidth: 3,
                        pointBackgroundColor: color,
                        pointBorderColor: "#0f172a",
                        pointBorderWidth: 2,
                        pointRadius: 4,
                        pointHoverRadius: 6,
                        fill: true,
                        tension: 0.35
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: { duration: 350 },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: "rgba(15,23,42,.96)",
                            borderColor: "rgba(75,85,99,.6)",
                            borderWidth: 1,
                            titleColor: "#e5e7eb",
                            bodyColor: "#93c5fd",
                            padding: 10,
                            callbacks: {
                                label: function (context) {
                                    return meta.tip + ": " + displayNum(context.parsed.y) + " кг";
                                }
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: false,
                            grid: { color: "rgba(75, 85, 99, 0.25)" },
                            ticks: {
                                color: "#9ca3af",
                                font: { weight: "bold", size: 10 },
                                callback: function (value) { return displayNum(value); }
                            }
                        },
                        x: {
                            grid: { display: false },
                            ticks: { color: "#9ca3af", font: { weight: "bold", size: 10 } }
                        }
                    }
                }
            });
        }

        /* ============================================================
           Аналитика
           ============================================================ */

        function showAnalytics(tab) {
            if (tab) analyticsTab = tab;
            document.querySelectorAll(".analytics-tab").forEach(function (btn) {
                btn.classList.toggle("active", btn.dataset.tab === analyticsTab);
            });
            showScreen("screen-analytics");
            renderAnalytics();
        }

        function setAnalyticsTab(tab) {
            if (!tab || analyticsTab === tab) return;
            analyticsTab = tab;
            document.querySelectorAll(".analytics-tab").forEach(function (btn) {
                btn.classList.toggle("active", btn.dataset.tab === tab);
            });
            haptic("light");
            renderAnalytics();
        }

        function renderAnalytics() {
            const body = document.getElementById("analytics-body");
            if (!body) return;
            body.innerHTML = "";
            if (analyticsTab === "volume") renderVolume(body);
            else if (analyticsTab === "body") renderBody(body);
            else renderRecords(body);
        }

        function groupSortIndex(group) {
            const order = ["ГРУДЬ", "СПИНА", "ПЛЕЧИ", "НОГИ", "РУКИ", "ДРУГОЕ"];
            const index = order.indexOf(group);
            return index === -1 ? order.length : index;
        }

        function renderRecords(container) {
            const records = new Map();
            historyData.forEach(function (workout) {
                const date = dateFromWorkout(workout);
                workout.exercises.forEach(function (ex) {
                    const canonical = canonicalName(ex.name);
                    let item = records.get(canonical);
                    if (!item) {
                        item = {
                            name: canonical,
                            group: groupOf(canonical),
                            bestWeight: 0,
                            bestReps: 0,
                            bestOneRM: 0,
                            lastDate: null,
                            sets: 0
                        };
                        records.set(canonical, item);
                    }
                    item.sets += ex.sets.length;
                    ex.sets.forEach(function (set) {
                        const weight = parseNum(set.weight);
                        const reps = parseNum(set.reps);
                        if (!isFinite(weight) || weight <= 0) return;
                        if (weight > item.bestWeight) {
                            item.bestWeight = weight;
                            item.bestReps = isFinite(reps) ? reps : 0;
                        }
                        if (isFinite(reps) && reps > 0) {
                            const estimate = estimate1RM(weight, reps);
                            if (estimate > item.bestOneRM) item.bestOneRM = estimate;
                        }
                    });
                    if (date && (!item.lastDate || date > item.lastDate)) item.lastDate = date;
                });
            });

            const list = Array.from(records.values())
                .filter(function (item) { return item.bestWeight > 0; })
                .sort(function (a, b) {
                    const groupDiff = groupSortIndex(a.group) - groupSortIndex(b.group);
                    return groupDiff !== 0 ? groupDiff : a.name.localeCompare(b.name, "ru");
                });

            if (!list.length) {
                container.innerHTML = '<div class="text-center py-12 text-gray-500 text-sm font-semibold">Пока нет рекордов — начни тренировку.</div>';
                return;
            }

            let html = "";
            let lastGroup = null;
            list.forEach(function (item) {
                if (item.group !== lastGroup) {
                    lastGroup = item.group;
                    const color = GROUP_COLORS[item.group] || "#6b7280";
                    html += '<div class="flex items-center gap-2 mt-3 mb-1.5">' +
                        '<span class="group-dot" style="background:' + color + ';color:' + color + '"></span>' +
                        '<span class="text-[9px] font-black tracking-widest" style="color:' + color + '">' + esc(item.group || "ДРУГОЕ") + '</span>' +
                    '</div>';
                }
                const dateText = item.lastDate ? formatShortDate(item.lastDate) : "";
                html += '<div class="record-row" data-record-ex="' + esc(item.name) + '">' +
                    '<div class="min-w-0 flex-1">' +
                        '<div class="record-name truncate">' + esc(item.name) + '</div>' +
                        '<div class="record-meta">' + (dateText ? "последний раз " + dateText + " · " : "") + item.sets + " подх.</div>" +
                    '</div>' +
                    '<div class="record-value">' +
                        '<div class="record-weight">' + displayNum(item.bestWeight) + ' кг × ' + displayNum(item.bestReps) + '</div>' +
                        '<div class="record-orm">1ПМ ≈ ' + Math.round(item.bestOneRM) + ' кг</div>' +
                    '</div>' +
                '</div>';
            });
            container.innerHTML = html;

            container.querySelectorAll("[data-record-ex]").forEach(function (row) {
                row.addEventListener("click", function () {
                    openChart(row.dataset.recordEx);
                });
            });
        }

        function getWeekStart(offset) {
            const now = new Date();
            const date = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 12);
            date.setDate(date.getDate() - ((date.getDay() + 6) % 7) + offset * 7);
            return date;
        }

        function renderVolume(container) {
            const start = getWeekStart(analyticsWeekOffset);
            const end = new Date(start.getFullYear(), start.getMonth(), start.getDate() + 7, 12);
            const stats = {};
            let totalSets = 0;
            let totalTonnage = 0;

            historyData.forEach(function (workout) {
                const date = dateFromWorkout(workout);
                if (!date || date < start || date >= end) return;
                workout.exercises.forEach(function (ex) {
                    const group = groupOf(ex.name) || "ДРУГОЕ";
                    if (!stats[group]) stats[group] = { sets: 0, tonnage: 0 };
                    ex.sets.forEach(function (set) {
                        const weight = parseNum(set.weight);
                        const reps = parseNum(set.reps);
                        stats[group].sets++;
                        totalSets++;
                        if (isFinite(weight) && isFinite(reps) && weight > 0 && reps > 0) {
                            stats[group].tonnage += weight * reps;
                            totalTonnage += weight * reps;
                        }
                    });
                });
            });

            const groups = Object.keys(stats).sort(function (a, b) {
                return stats[b].sets - stats[a].sets;
            });
            const maxSets = Math.max.apply(null, groups.map(function (g) { return stats[g].sets; }).concat([1]));
            const range = formatShortDate(start) + " – " + formatShortDate(new Date(start.getFullYear(), start.getMonth(), start.getDate() + 6, 12));

            let html = '<div class="card-glass rounded-2xl p-3 mb-4">' +
                '<div class="flex items-center justify-between mb-3">' +
                    '<div>' +
                        '<div class="text-[9px] font-black tracking-widest text-gray-500">НЕДЕЛЯ</div>' +
                        '<div class="text-sm font-black text-gray-200 mt-0.5">' + range + '</div>' +
                    '</div>' +
                    '<div class="flex gap-1">' +
                        '<button type="button" data-volume-week="-1" class="w-9 h-9 rounded-lg bg-gray-800/70 border border-gray-700/60 text-gray-300">‹</button>' +
                        '<button type="button" data-volume-week="1" class="w-9 h-9 rounded-lg bg-gray-800/70 border border-gray-700/60 text-gray-300" ' + (analyticsWeekOffset >= 0 ? "disabled style=opacity:.35" : "") + '>›</button>' +
                    '</div>' +
                '</div>' +
                '<div class="grid grid-cols-2 gap-2">' +
                    '<div class="stat-card"><div class="stat-value">' + totalSets + '</div><div class="stat-label">подходов</div></div>' +
                    '<div class="stat-card"><div class="stat-value">' + esc(formatTonnage(totalTonnage)) + '</div><div class="stat-label">тоннаж</div></div>' +
                '</div>' +
            '</div>';

            if (!groups.length) {
                html += '<div class="text-center py-10 text-gray-500 text-sm font-semibold">На этой неделе тренировок нет.</div>';
            } else {
                html += '<div class="card-glass rounded-2xl p-4 mb-4"><div class="text-[9px] font-black tracking-widest text-gray-500 mb-3">ПО ГРУППАМ МЫШЦ</div>';
                groups.forEach(function (group) {
                    const item = stats[group];
                    const color = GROUP_COLORS[group] || "#6b7280";
                    const width = Math.max(2, (item.sets / maxSets) * 100);
                    html += '<div class="volume-row">' +
                        '<div class="volume-head"><span>' + esc(group) + '</span><span>' + item.sets + ' подх.</span></div>' +
                        '<div class="volume-track"><div class="volume-fill" style="width:' + width + '%;background:' + color + '"></div></div>' +
                        '<div class="volume-sub">' + esc(formatTonnage(item.tonnage)) + '</div>' +
                    '</div>';
                });
                html += '</div>';
            }

            const recap = buildMonthlyRecap();
            if (recap) {
                html += '<div class="card-glass rounded-2xl p-4">' +
                    '<div class="text-[9px] font-black tracking-widest text-gray-500 mb-2">' + recap.title + '</div>' +
                    '<div class="text-xs text-gray-300 leading-relaxed">' + recap.summary + '</div>' +
                    '<button type="button" data-share-recap class="mt-3 w-full bg-gray-800 border border-gray-600 text-gray-200 font-bold py-2.5 rounded-xl text-[11px]">ПОДЕЛИТЬСЯ ИТОГОМ</button>' +
                '</div>';
            }
            container.innerHTML = html;

            container.querySelectorAll("[data-volume-week]").forEach(function (btn) {
                btn.addEventListener("click", function () {
                    const delta = Number(btn.dataset.volumeWeek);
                    const next = analyticsWeekOffset + delta;
                    if (next > 0) return;
                    analyticsWeekOffset = next;
                    renderVolume(container);
                });
            });
            const shareBtn = container.querySelector("[data-share-recap]");
            if (shareBtn) {
                shareBtn.addEventListener("click", function () {
                    const text = buildMonthlyRecapText();
                    if (text) shareText(text);
                });
            }
        }

        function buildMonthlyRecap() {
            const now = new Date();
            let workouts = 0;
            let tonnage = 0;
            let prSets = 0;
            const groups = {};
            historyData.forEach(function (workout) {
                const date = dateFromWorkout(workout);
                if (!date || date.getFullYear() !== now.getFullYear() || date.getMonth() !== now.getMonth()) return;
                workouts++;
                workout.exercises.forEach(function (ex) {
                    const group = groupOf(ex.name) || "ДРУГОЕ";
                    ex.sets.forEach(function (set) {
                        const weight = parseNum(set.weight);
                        const reps = parseNum(set.reps);
                        if (set.pr) prSets++;
                        if (isFinite(weight) && isFinite(reps) && weight > 0 && reps > 0) {
                            tonnage += weight * reps;
                            groups[group] = (groups[group] || 0) + weight * reps;
                        }
                    });
                });
            });
            if (!workouts) return null;
            let topGroup = "";
            let topTonnage = 0;
            Object.keys(groups).forEach(function (group) {
                if (groups[group] > topTonnage) { topGroup = group; topTonnage = groups[group]; }
            });
            const month = monthTitle(now).toUpperCase();
            return {
                title: "ИТОГ МЕСЯЦА · " + month,
                summary: workouts + " тренировок · " + esc(formatTonnage(tonnage)) + " · " +
                    prSets + " " + plural(prSets, "рекорд", "рекорда", "рекордов") +
                    (topGroup ? " · больше всего: " + esc(topGroup) + " (" + esc(formatTonnage(topTonnage)) + ")" : ""),
                workouts: workouts,
                tonnage: tonnage,
                prSets: prSets,
                topGroup: topGroup
            };
        }

        function buildMonthlyRecapText() {
            const recap = buildMonthlyRecap();
            if (!recap) return "";
            return "🏋️ " + recap.title + "\n\n" +
                "Тренировок: " + recap.workouts + "\n" +
                "Общий тоннаж: " + formatTonnage(recap.tonnage) + "\n" +
                "Рекордов: " + recap.prSets +
                (recap.topGroup ? "\nБольше всего: " + recap.topGroup : "") +
                "\n\nGym Tracker";
        }

        async function shareText(text) {
            if (!text) return;
            try {
                if (navigator.share) {
                    await navigator.share({ text: text });
                    return;
                }
            } catch (e) {
                if (e && e.name === "AbortError") return;
            }
            const ok = await copyText(text);
            showToast(ok ? "Текст скопирован" : "Не удалось скопировать", ok ? "success" : "error");
        }

        function renderBody(container) {
            if (bodyChartInstance) {
                try { bodyChartInstance.destroy(); } catch (e) {}
                bodyChartInstance = null;
            }
            const entries = (settings.bodyWeights || []).slice().sort(function (a, b) {
                return a.dateISO < b.dateISO ? -1 : 1;
            });

            if (!entries.length) {
                container.innerHTML = '<div class="text-center py-10">' +
                    '<div class="text-4xl mb-3 opacity-40">⚖️</div>' +
                    '<p class="text-gray-500 text-sm font-semibold mb-4">Пока нет записей веса тела.</p>' +
                    '<button type="button" data-body-add class="btn-primary text-white font-black px-5 py-3 rounded-xl text-xs">＋ ЗАПИСАТЬ ВЕС</button>' +
                '</div>';
                const add = container.querySelector("[data-body-add]");
                if (add) add.addEventListener("click", openBodyWeightModal);
                return;
            }

            const latest = entries[entries.length - 1];
            const previous = entries.length > 1 ? entries[entries.length - 2] : null;
            const delta = previous ? round2(latest.weight - previous.weight) : 0;
            const deltaText = previous ? (delta > 0 ? "+" : "") + displayNum(delta) + " кг" : "первая запись";

            let html = '<div class="card-glass rounded-2xl p-4 mb-4">' +
                '<div class="flex items-end justify-between">' +
                    '<div>' +
                        '<div class="text-[9px] font-black tracking-widest text-gray-500">ТЕКУЩИЙ ВЕС</div>' +
                        '<div class="text-3xl font-black text-blue-300 mt-1">' + displayNum(latest.weight) + ' <span class="text-sm text-gray-400">кг</span></div>' +
                        '<div class="text-[10px] font-bold mt-1 ' + (delta > 0 ? "text-amber-300" : "text-emerald-300") + '">' + deltaText + '</div>' +
                    '</div>' +
                    '<button type="button" data-body-add class="btn-primary text-white font-black px-3 py-2 rounded-lg text-[10px]">＋ ЗАПИСАТЬ</button>' +
                '</div>' +
                '<div class="mt-3" style="height:150px"><canvas id="body-chart"></canvas></div>' +
            '</div>' +
            '<div class="card-glass rounded-2xl p-3 mb-4">' +
                '<div class="text-[9px] font-black tracking-widest text-gray-500 mb-2">ПОСЛЕДНИЕ ЗАПИСИ</div>';
            entries.slice().reverse().slice(0, 12).forEach(function (entry) {
                html += '<div class="body-row"><span>' + formatShortDate(new Date(entry.dateISO + "T12:00:00")) + '</span>' +
                    '<span class="flex items-center gap-2"><b>' + displayNum(entry.weight) + ' кг</b>' +
                    '<button type="button" data-body-del="' + entry.id + '" class="text-red-400/70 text-xs px-1">✕</button></span></div>';
            });
            html += '</div>';
            container.innerHTML = html;

            container.querySelectorAll("[data-body-add]").forEach(function (btn) {
                btn.addEventListener("click", openBodyWeightModal);
            });
            container.querySelectorAll("[data-body-del]").forEach(function (btn) {
                btn.addEventListener("click", function () {
                    const id = Number(btn.dataset.bodyDel);
                    settings.bodyWeights = (settings.bodyWeights || []).filter(function (e) { return e.id !== id; });
                    saveSettings();
                    renderBody(container);
                    showToast("Запись удалена");
                });
            });

            if (typeof Chart !== "undefined") {
                const canvas = document.getElementById("body-chart");
                if (canvas) {
                    if (bodyChartInstance) bodyChartInstance.destroy();
                    bodyChartInstance = new Chart(canvas.getContext("2d"), {
                        type: "line",
                        data: {
                            labels: entries.map(function (e) { return formatShortDate(new Date(e.dateISO + "T12:00:00")); }),
                            datasets: [{
                                data: entries.map(function (e) { return e.weight; }),
                                borderColor: "#60a5fa",
                                backgroundColor: "rgba(59,130,246,.12)",
                                borderWidth: 2,
                                pointRadius: 3,
                                fill: true,
                                tension: 0.3
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: { legend: { display: false } },
                            scales: {
                                y: {
                                    grid: { color: "rgba(75,85,99,.2)" },
                                    ticks: { color: "#9ca3af", font: { size: 9 }, callback: function (v) { return displayNum(v); } }
                                },
                                x: {
                                    grid: { display: false },
                                    ticks: { color: "#9ca3af", font: { size: 9 } }
                                }
                            }
                        }
                    });
                }
            }
        }

        function openBodyWeightModal() {
            const today = todayISO();
            showModal({
                title: "Вес тела",
                body: '<label class="input-label" for="body-date">Дата</label>' +
                    '<input id="body-date" type="date" value="' + today + '" class="w-full rounded-xl p-3 text-white font-semibold">' +
                    '<label class="input-label mt-3" for="body-weight">Вес, кг</label>' +
                    '<input id="body-weight" type="number" inputmode="decimal" step="0.1" placeholder="80" class="w-full rounded-xl p-3 text-white font-semibold">',
                actions: [
                    { label: "Отмена", value: null },
                    {
                        label: "Сохранить",
                        primary: true,
                        onClick: function (sheet) {
                            const dateInput = sheet.querySelector("#body-date");
                            const weightInput = sheet.querySelector("#body-weight");
                            const dateISO = dateInput ? dateInput.value : today;
                            const weight = parseNum(weightInput ? weightInput.value : "");
                            if (!/^\d{4}-\d{2}-\d{2}$/.test(dateISO)) {
                                showToast("Выбери дату", "error");
                                return false;
                            }
                            if (!isFinite(weight) || weight <= 0 || weight > 500) {
                                showToast("Проверь вес", "error");
                                return false;
                            }
                            settings.bodyWeights = (settings.bodyWeights || []).filter(function (e) { return e.dateISO !== dateISO; });
                            settings.bodyWeights.push({ id: Date.now(), dateISO: dateISO, weight: round2(weight) });
                            settings.bodyWeights.sort(function (a, b) { return a.dateISO < b.dateISO ? -1 : 1; });
                            saveSettings();
                            showToast("Вес записан", "success");
                            if (analyticsTab === "body") renderAnalytics();
                            return true;
                        }
                    }
                ]
            });
        }

        function openSettingsSheet() {
            showModal({
                title: "Настройки",
                body: '<div class="switch-row">' +
                        '<div><div class="switch-label">Звук окончания отдыха</div><div class="switch-sub">Короткий сигнал после таймера</div></div>' +
                        '<button type="button" class="switch-btn' + (settings.sound ? " on" : "") + '" data-setting-toggle="sound"></button>' +
                    '</div>' +
                    '<div class="switch-row">' +
                        '<div><div class="switch-label">Не гасить экран</div><div class="switch-sub">Пока идёт тренировка</div></div>' +
                        '<button type="button" class="switch-btn' + (settings.keepAwake ? " on" : "") + '" data-setting-toggle="keepAwake"></button>' +
                    '</div>',
                actions: [{ label: "Готово", value: null }],
                onMount: function (sheet) {
                    sheet.querySelectorAll("[data-setting-toggle]").forEach(function (btn) {
                        btn.addEventListener("click", function () {
                            const key = btn.dataset.settingToggle;
                            settings[key] = !settings[key];
                            saveSettings();
                            btn.classList.toggle("on", !!settings[key]);
                            haptic("light");
                            if (key === "sound" && settings.sound) ensureAudio();
                            if (key === "keepAwake") {
                                if (settings.keepAwake) requestWakeLock();
                                else releaseWakeLock();
                            }
                        });
                    });
                }
            });
        }

        function openPlateCalc() {
            const current = parseNum(document.getElementById("input-weight").value) || 0;
            const initial = current > 0 ? current : 60;

            function breakdown(total) {
                const bar = 20;
                if (!isFinite(total) || total <= 0) return { error: "Введи общий вес" };
                if (total < bar) return { error: "Меньше веса грифа (20 кг)" };
                const perSide = (total - bar) / 2;
                const plates = [25, 20, 15, 10, 5, 2.5, 1.25];
                let rest = perSide;
                const used = [];
                plates.forEach(function (plate) {
                    const count = Math.floor((rest + 0.001) / plate);
                    if (count > 0) {
                        used.push({ plate: plate, count: count });
                        rest = round2(rest - count * plate);
                    }
                });
                return { perSide: perSide, used: used, rest: rest };
            }

            function renderResult(total) {
                const result = breakdown(total);
                const target = document.getElementById("plate-result");
                if (!target) return;
                if (result.error) {
                    target.innerHTML = '<div class="text-center text-gray-500 text-sm py-4">' + esc(result.error) + '</div>';
                    return;
                }
                let html = '<div class="plate-row"><span>Общий вес</span><span class="plate-weight">' + displayNum(total) + ' кг</span></div>' +
                    '<div class="plate-row"><span>Гриф</span><span class="plate-values">20 кг</span></div>' +
                    '<div class="plate-row"><span>На сторону</span><span class="plate-weight">' + displayNum(result.perSide) + ' кг</span></div>' +
                    '<div class="text-[10px] text-gray-500 font-bold mt-3 mb-1">БЛИНЫ НА СТОРОНУ</div>';
                if (!result.used.length) {
                    html += '<div class="text-sm text-gray-400 font-semibold">Только гриф</div>';
                } else {
                    result.used.forEach(function (item) {
                        html += '<div class="plate-row"><span>' + displayNum(item.plate) + ' кг</span><span class="plate-values">× ' + item.count + '</span></div>';
                    });
                }
                if (result.rest > 0.01) {
                    html += '<div class="plate-muted mt-2">Остаток: ' + displayNum(result.rest) + ' кг на сторону</div>';
                }
                target.innerHTML = html;
            }

            showModal({
                title: "Калькулятор блинов",
                message: "Гриф 20 кг. Вес делится поровну на две стороны.",
                body: '<label class="input-label" for="plate-total">Общий вес, кг</label>' +
                    '<input id="plate-total" type="number" inputmode="decimal" step="2.5" value="' + initial + '" class="w-full rounded-xl p-3 text-white font-semibold text-lg">' +
                    '<div id="plate-result" class="mt-3"></div>',
                actions: [{ label: "Готово", value: null }],
                onMount: function (sheet) {
                    const input = sheet.querySelector("#plate-total");
                    if (input) {
                        input.addEventListener("input", function () { renderResult(parseNum(input.value)); });
                        renderResult(parseNum(input.value));
                    }
                }
            });
        }



        async function copyText(text) {
            try {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    await navigator.clipboard.writeText(text);
                    return true;
                }
            } catch (e) {}

            try {
                const area = document.createElement("textarea");
                area.value = text;
                area.style.position = "fixed";
                area.style.opacity = "0";
                area.style.left = "-9999px";
                document.body.appendChild(area);
                area.select();
                const ok = document.execCommand("copy");
                area.remove();
                return ok;
            } catch (e) {
                return false;
            }
        }

        function buildHistoryText() {
            let text = "🏋️‍♂️ МОЯ ИСТОРИЯ ТРЕНИРОВОК\n\n";
            historyData.forEach(function (workout) {
                text += "📅 " + workout.date + (workout.duration ? " (" + workout.duration + ")" : "") + (workout.mood ? " " + workout.mood : "") + "\n";
                workout.exercises.forEach(function (ex) {
                    const setsText = ex.sets.map(function (set, index) {
                        return (index + 1) + "-" + displayNum(set.weight) + "кг×" + displayNum(set.reps) + (set.pr ? "🏆" : "");
                    }).join(", ");
                    text += "• " + canonicalName(ex.name) + ": " + setsText + "\n";
                });
                if (workout.note) text += "📝 " + workout.note + "\n";
                text += "\n";
            });
            return text;
        }

        function markBackup() {
            settings.lastBackup = Date.now();
            saveSettings();
            renderBackupReminder();
        }

        async function exportBackupFile() {
            const payload = JSON.stringify(buildBackup(), null, 2);
            const fileName = "gym-backup-" + todayISO() + ".json";
            const blob = new Blob([payload], { type: "application/json" });

            try {
                const file = new File([blob], fileName, { type: "application/json" });
                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    await navigator.share({ files: [file], title: "Gym Tracker — резервная копия" });
                    markBackup();
                    showToast("Файл сохранён", "success");
                    return;
                }
            } catch (e) {
                if (e && e.name === "AbortError") return;
            }

            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.href = url;
            link.download = fileName;
            link.rel = "noopener";
            document.body.appendChild(link);
            link.click();
            link.remove();
            setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
            markBackup();
            showToast("Файл сохранён", "success");
        }

        async function openDataSheet() {
            let totalSets = 0;
            let totalTonnage = 0;
            historyData.forEach(function (workout) {
                totalSets += workout.exercises.reduce(function (sum, ex) { return sum + ex.sets.length; }, 0);
                totalTonnage += workoutTonnage(workout);
            });

            const lastBackup = settings.lastBackup
                ? new Date(settings.lastBackup).toLocaleDateString("ru-RU")
                : "ещё не делал";

            const body =
                '<div class="data-stats">' +
                    '<div><b>' + historyData.length + '</b><span>тренировок</span></div>' +
                    '<div><b>' + totalSets + '</b><span>подходов</span></div>' +
                    '<div><b>' + esc(formatTonnage(totalTonnage)) + '</b><span>тоннаж</span></div>' +
                '</div>' +
                '<p class="text-[10px] text-gray-500 font-semibold mt-3">Последняя копия: ' + esc(lastBackup) + '</p>';

            await showModal({
                title: "Данные и резервная копия",
                message: "История хранится только в этом браузере. Сохрани файл, чтобы не потерять её при очистке данных Telegram.",
                body: body,
                actions: [
                    {
                        label: "💾 Сохранить файл (.json)",
                        primary: true,
                        onClick: async function () { await exportBackupFile(); }
                    },
                    {
                        label: "📋 Скопировать JSON",
                        onClick: async function () {
                            const ok = await copyText(JSON.stringify(buildBackup(), null, 2));
                            showToast(ok ? "JSON скопирован" : "Не удалось скопировать", ok ? "success" : "error");
                        }
                    },
                    {
                        label: "📄 Скопировать текст",
                        onClick: async function () {
                            const ok = await copyText(buildHistoryText());
                            showToast(ok ? "История скопирована" : "Не удалось скопировать", ok ? "success" : "error");
                        }
                    },
                    {
                        label: "📥 Загрузить из файла",
                        onClick: function () {
                            const input = document.getElementById("import-file");
                            if (input) input.click();
                        }
                    },
                    {
                        label: "🕘 Локальные копии",
                        onClick: function () { setTimeout(openSnapshotsSheet, 220); }
                    },
                    {
                        label: "⚙️ Настройки",
                        onClick: function () { setTimeout(openSettingsSheet, 220); }
                    },
                    { label: "Закрыть", value: null }
                ]
            });
        }

        function readFileText(file) {
            return new Promise(function (resolve, reject) {
                if (file.text) {
                    file.text().then(resolve, reject);
                    return;
                }
                const reader = new FileReader();
                reader.onload = function () { resolve(String(reader.result || "")); };
                reader.onerror = reject;
                reader.readAsText(file);
            });
        }

        function mergeImportedSettings(raw) {
            if (!raw || typeof raw !== "object") return;
            const imported = normalizeSettings(raw);

            Object.keys(imported.rest).forEach(function (key) {
                if (key === "__proto__" || key === "constructor" || key === "prototype") return;
                const value = Number(imported.rest[key]);
                if (isFinite(value)) settings.rest[key] = Math.max(15, Math.min(600, Math.round(value)));
            });

            Object.keys(imported.exerciseNotes).forEach(function (key) {
                settings.exerciseNotes[key] = imported.exerciseNotes[key];
            });

            imported.customExercises.forEach(function (item) {
                const exists = (settings.customExercises || []).some(function (current) {
                    return canonicalName(current.name) === canonicalName(item.name);
                });
                if (!exists) settings.customExercises.push(item);
            });

            imported.templates.forEach(function (template) {
                const exists = (settings.templates || []).some(function (current) {
                    return current.name === template.name;
                });
                if (!exists) settings.templates.push(template);
            });

            imported.bodyWeights.forEach(function (entry) {
                settings.bodyWeights = (settings.bodyWeights || []).filter(function (current) {
                    return current.dateISO !== entry.dateISO;
                });
                settings.bodyWeights.push(entry);
            });
            settings.bodyWeights.sort(function (a, b) { return a.dateISO < b.dateISO ? -1 : 1; });

            if (typeof raw.sound === "boolean") settings.sound = raw.sound;
            if (typeof raw.keepAwake === "boolean") settings.keepAwake = raw.keepAwake;
            settings.legacyRestoreVersion = Math.max(Number(settings.legacyRestoreVersion) || 0, Number(raw.legacyRestoreVersion) || 0);
        }

        async function onImportFile(event) {
            const input = event.target;
            const file = input.files && input.files[0];
            input.value = "";
            if (!file) return;

            try {
                const text = await readFileText(file);
                const parsed = JSON.parse(text);
                let rawHistory = null;
                let importedSettings = null;

                if (Array.isArray(parsed)) {
                    rawHistory = parsed;
                } else if (parsed && Array.isArray(parsed.history)) {
                    rawHistory = parsed.history;
                    importedSettings = parsed.settings || null;
                } else {
                    throw new Error("Неверный формат файла. Ожидается JSON с историей тренировок.");
                }

                const imported = rawHistory.map(sanitizeWorkout).filter(Boolean);
                if (!imported.length) throw new Error("В файле не нашлось ни одной тренировки.");

                const choice = await showModal({
                    title: "Импорт истории",
                    message: "В файле " + imported.length + " " + plural(imported.length, "тренировка", "тренировки", "тренировок") + ". Как добавить их?",
                    body:
                        '<div class="data-stats">' +
                            '<div><b>' + historyData.length + '</b><span>сейчас</span></div>' +
                            '<div><b>' + imported.length + '</b><span>в файле</span></div>' +
                        '</div>',
                    actions: [
                        { label: "Заменить текущие", danger: true, onClick: function () { return { mode: "replace" }; } },
                        { label: "Добавить к текущим", primary: true, onClick: function () { return { mode: "merge" }; } },
                        { label: "Отмена", value: null }
                    ]
                });

                if (!choice) return;

                const previousHistory = JSON.parse(JSON.stringify(historyData));
                const previousSettings = JSON.parse(JSON.stringify(settings));
                if (historyData.length) createSnapshot("Перед импортом");

                if (choice.mode === "replace") {
                    historyData = imported;
                } else {
                    const ids = new Set(historyData.map(function (w) { return w.id; }));
                    imported.forEach(function (workout) {
                        if (ids.has(workout.id)) {
                            workout.id = Date.now() + Math.floor(Math.random() * 1000000);
                        }
                        ids.add(workout.id);
                        historyData.push(workout);
                    });
                }

                mergeImportedSettings(importedSettings);
                saveSettings();

                if (choice.mode === "replace") expandedIds.clear();

                sortHistory();
                persistHistory();
                renderAll();
                renderBackupReminder();
                showScreen("screen-history");
                const scroll = document.getElementById("history-scroll");
                if (scroll) scroll.scrollTop = 0;
                showToast("Импортировано: " + imported.length, "success", 2800);
                haptic("success");
                showUndoBar("История импортирована", function () {
                    historyData = previousHistory;
                    settings = normalizeSettings(previousSettings);
                    saveSettings();
                    persistHistory();
                    expandedIds.clear();
                    renderAll();
                    renderBackupReminder();
                    showScreen("screen-history");
                    showToast("Импорт отменён");
                }, 10000);
            } catch (err) {
                uiAlert(err && err.message ? err.message : "Не удалось прочитать файл.", "Ошибка импорта");
            }
        }

        /* ============================================================
           Навигация
           ============================================================ */

        function showScreen(screenId) {
            const current = document.querySelector(".screen:not(.hidden)");
            if (current && current.id === screenId) {
                updateBackButton();
                return;
            }

            document.querySelectorAll(".screen").forEach(function (screen) {
                screen.classList.add("hidden");
                screen.classList.remove("screen-in");
            });

            const target = document.getElementById(screenId);
            if (!target) return;
            target.classList.remove("hidden");
            void target.offsetWidth;
            target.classList.add("screen-in");

            if (screenId !== "screen-history") hideUndoBar();
            updateBackButton();

            if (screenId === "screen-history") {
                setTimeout(recalcCardHeights, 30);
            }
        }

        function handleBack() {
            if (modalStack.length > 0) {
                const close = modalStack[modalStack.length - 1];
                if (close) close(null);
                return;
            }

            const activeScreen = currentScreenId();
            if (activeScreen === "screen-chart") {
                closeChart();
                return;
            }
            if (activeScreen === "screen-analytics") {
                showScreen("screen-history");
                return;
            }
            if (activeScreen === "screen-select-exercise") {
                backFromSelect();
                return;
            }
            if (activeScreen === "screen-active-exercise") {
                requestAbortWorkout();
            }
        }

        /* ============================================================
           Инициализация
           ============================================================ */

        function init() {
            if (tg) { try { tg.ready(); } catch (e) {} }

            loadData();
            renderExerciseList();
            renderStats();
            renderHeatmap();
            showScreen("screen-history");
            renderHistory();
            updateTimerDisplay();
            updateRestPrefDisplay();
            loadPendingSession();
            renderBackupReminder();
            renderPlanBar();
            updateExerciseNotePreview();

            if (tg && tg.BackButton) {
                try { tg.BackButton.onClick(handleBack); } catch (e) {}
            }

            const fileInput = document.getElementById("import-file");
            if (fileInput) fileInput.addEventListener("change", onImportFile);

            document.addEventListener("visibilitychange", function () {
                if (document.hidden) {
                    persistActiveSession();
                    releaseWakeLock();
                    return;
                }
                if (isResting) tickRest();
                if (timerInterval) {
                    elapsedSeconds = Math.floor((Date.now() - workoutStartTime) / 1000);
                    updateTimerDisplay();
                    requestWakeLock();
                }
            });

            window.addEventListener("pagehide", persistActiveSession);
            window.addEventListener("beforeunload", persistActiveSession);

            document.addEventListener("keydown", function (e) {
                if (e.key === "Escape" && modalStack.length === 0 && currentScreenId() !== "screen-history") {
                    handleBack();
                }
            });

            document.addEventListener("pointerdown", function (e) {
                if (!openSwipeCard) return;
                const openWrap = openSwipeCard.closest(".swipe-wrap");
                const inside = openWrap ? openWrap.contains(e.target) : openSwipeCard.contains(e.target);
                if (!inside) {
                    setCardX(openSwipeCard, 0, true);
                    openSwipeCard = null;
                }
            }, true);

            window.addEventListener("resize", function () {
                if (resizeTimer) clearTimeout(resizeTimer);
                resizeTimer = setTimeout(function () {
                    if (currentScreenId() === "screen-history") recalcCardHeights();
                }, 160);
            });
        }

        if (document.readyState === "complete") init();
        else window.addEventListener("load", init);
    </script>
</body>
