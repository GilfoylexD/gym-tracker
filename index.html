        function selectExercise(name, element) {
            currentExercise = name;
            const heading = document.getElementById("current-exercise-name");
            if (heading) heading.textContent = displayExerciseName(name);

            document.querySelectorAll(".exercise-item").forEach(function (el) {
                el.classList.remove("selected");
            });
            if (element) element.classList.add("selected");

            haptic("medium");
            updateLastStatsCard(name);
            renderPlanBar();
            persistActiveSession();
        }

        function syncExerciseSelection() {
            document.querySelectorAll(".exercise-item").forEach(function (el) {
                const label = el.querySelector("span");
                el.classList.toggle("selected", !!label && label.textContent === currentExercise);
            });
        }

        function goToExercise() {
            if (!currentExercise) {
                uiAlert("Сначала выбери упражнение.", "Упражнение не выбрано");
                return;
            }
            stopRestTimer();
            const heading = document.getElementById("current-exercise-name");
            if (heading) heading.textContent = displayExerciseName(currentExercise);
            const container = document.getElementById("sets-container");
            if (container) container.innerHTML = "";

            const existing = currentSessionExercises.find(function (ex) { return ex.name === currentExercise; });
            if (existing) {
                existing.sets.forEach(function (set, index) {
                    renderSetRow(set, index + 1, existing);
                });
            }

            updateLastStatsCard(currentExercise);
            updateExerciseNotePreview();
            prepareInputs(existing);
            renderPlanBar();
            persistActiveSession();
            updateRestNext();

            showScreen("screen-active-exercise");
            haptic("light");
        }

        function prepareInputs(existing) {
            if (existing && existing.sets.length) {
                const lastDone = existing.sets[existing.sets.length - 1];
                document.getElementById("input-weight").value = lastDone.weight;
                document.getElementById("input-reps").value = lastDone.reps;
                setAutofillHint("Продолжаем: " + displayNum(lastDone.weight) + " кг × " + displayNum(lastDone.reps));
                return;
            }

            const lastSets = getLastSetsFor(currentExercise);
            const ref = lastSets[0] || null;

            if (ref) {
                document.getElementById("input-weight").value = ref.weight;
                document.getElementById("input-reps").value = ref.reps;
                setAutofillHint("С прошлого раза: " + displayNum(ref.weight) + " кг × " + displayNum(ref.reps));
            } else {
                document.getElementById("input-weight").value = "";
                document.getElementById("input-reps").value = "";
                setAutofillHint("Введи вес и количество повторений");
            }
        }

        function prepareNextInputs(exData) {
            const justDone = exData.sets[exData.sets.length - 1];
            if (!justDone) return;

            document.getElementById("input-weight").value = justDone.weight;
            document.getElementById("input-reps").value = justDone.reps;

            const lastSets = getLastSetsFor(currentExercise);
            const index = exData.sets.length;
            const historical = lastSets[index];

            if (historical) {
                setAutofillHint("Повтори: " + displayNum(justDone.weight) + "×" + displayNum(justDone.reps) +
                    " · прошлый раз: " + displayNum(historical.weight) + "×" + displayNum(historical.reps));
            } else {
                setAutofillHint("Повтори: " + displayNum(justDone.weight) + " кг × " + displayNum(justDone.reps));
            }
        }

        /* ============================================================
           Тренировка
           ============================================================ */

        function planFromWorkout(workout) {
            if (!workout) return [];
            return workout.exercises.map(function (ex) {
                return {
                    name: canonicalName(ex.name),
                    targetSets: Math.max(1, Math.min(20, ex.sets.length || 4))
                };
            });
        }

        function renderPlanBar() {
            const bar = document.getElementById("plan-bar");
            if (!bar) return;
            if (!currentPlan.length) {
                bar.classList.add("hidden");
                bar.innerHTML = "";
                return;
            }
            bar.classList.remove("hidden");
            bar.innerHTML = currentPlan.map(function (item, index) {
                const ex = currentSessionExercises.find(function (sessionEx) {
                    return canonicalName(sessionEx.name) === canonicalName(item.name);
                });
                const count = ex ? ex.sets.length : 0;
                const done = count >= item.targetSets;
                const active = canonicalName(currentExercise) === canonicalName(item.name);
                return '<button type="button" class="plan-chip' + (active ? " active" : "") + (done ? " done" : "") +
                    '" data-plan-index="' + index + '">' +
                    '<span>' + (done ? "✓ " : "") + esc(displayExerciseName(item.name)) + '</span>' +
                    '<em>' + count + '/' + item.targetSets + '</em>' +
                '</button>';
            }).join("");

            bar.querySelectorAll("[data-plan-index]").forEach(function (btn) {
                btn.addEventListener("click", function () {
                    const item = currentPlan[Number(btn.dataset.planIndex)];
                    if (!item) return;
                    if (canonicalName(item.name) === canonicalName(currentExercise)) return;
                    currentExercise = item.name;
                    haptic("light");
                    goToExercise();
                });
            });
        }

        async function createTemplateFromLast() {
            const last = historyData[0];
            if (!last) {
                showToast("Пока нет тренировок для шаблона", "error");
                return;
            }
            const suggested = "Тренировка " + (last.shortDate || "");
            const name = await showModal({
                title: "Шаблон из последней",
                message: "Сохранит упражнения и количество подходов. Веса подставятся из истории.",
                body: '<label class="input-label" for="template-name">Название</label>' +
                    '<input id="template-name" class="w-full rounded-xl p-3 text-white font-semibold" maxlength="60" value="' + esc(suggested) + '">',
                actions: [
                    { label: "Отмена", value: null },
                    {
                        label: "Создать",
                        primary: true,
                        onClick: function (sheet) {
                            const input = sheet.querySelector("#template-name");
                            const value = input ? input.value.trim() : "";
                            if (!value) {
                                showToast("Введи название шаблона", "error");
                                return false;
                            }
                            return value;
                        }
                    }
                ]
            });
            if (!name) return;

            settings.templates = settings.templates || [];
            settings.templates.unshift({
                id: Date.now(),
                name: name.slice(0, 60),
                createdAt: Date.now(),
                exercises: planFromWorkout(last)
            });
            saveSettings();
            showToast("Шаблон создан", "success");
            haptic("success");
        }

        async function openStartSheet() {
            const templates = settings.templates || [];
            const hasHistory = historyData.length > 0;

            let body = "";
            if (pendingSession) {
                const sets = pendingSession.exercises.reduce(function (sum, ex) { return sum + ex.sets.length; }, 0);
                body += '<button type="button" class="resume-banner w-full text-left" data-start-resume>' +
                    '<div class="text-[9px] font-black tracking-widest text-blue-300">НЕЗАВЕРШЁННАЯ</div>' +
                    '<div class="text-[11px] text-gray-300 font-semibold mt-1">' + sets + ' ' +
                        plural(sets, "подход", "подхода", "подходов") + ' · нажми, чтобы продолжить</div>' +
                '</button>';
            }
            body += '<div class="modal-label">ШАБЛОНЫ</div><div id="start-template-list">';
            if (!templates.length) {
                body += '<p class="text-[10px] text-gray-500 font-semibold py-2">Пока нет шаблонов. Создай из последней тренировки.</p>';
            } else {
                body += templates.map(function (template) {
                    return '<div class="template-row" data-template-id="' + template.id + '" role="button" tabindex="0">' +
                        '<div class="min-w-0 flex-1">' +
                            '<div class="template-name">' + esc(template.name) + '</div>' +
                            '<div class="template-meta">' + template.exercises.length + ' ' +
                                plural(template.exercises.length, "упражнение", "упражнения", "упражнений") + '</div>' +
                        '</div>' +
                        '<button type="button" class="template-del" data-template-del="' + template.id + '" aria-label="Удалить шаблон">✕</button>' +
                    '</div>';
                }).join("");
            }
            body += '</div>';

            const actions = [
                { label: "Пустая тренировка", primary: true, value: { type: "empty" } },
                { label: "Закрыть", value: null }
            ];
            if (hasHistory) {
                actions.splice(1, 0, { label: "Повторить последнюю", value: { type: "last" } });
                actions.splice(2, 0, { label: "Создать шаблон из последней", value: { type: "create" } });
            }

            const result = await showModal({
                title: "Начать тренировку",
                message: "Можно начать с пустого листа, повторить последнюю или выбрать шаблон.",
                body: body,
                actions: actions,
                onMount: function (sheet, close) {
                    const resume = sheet.querySelector("[data-start-resume]");
                    if (resume) resume.addEventListener("click", function () { close({ type: "resume" }); });
                    sheet.querySelectorAll("[data-template-id]").forEach(function (row) {
                        row.addEventListener("click", function () { close({ type: "template", id: Number(row.dataset.templateId) }); });
                    });
                    sheet.querySelectorAll("[data-template-del]").forEach(function (btn) {
                        btn.addEventListener("click", function (e) {
                            e.stopPropagation();
                            const id = Number(btn.dataset.templateDel);
                            settings.templates = (settings.templates || []).filter(function (t) { return t.id !== id; });
                            saveSettings();
                            const row = btn.closest(".template-row");
                            if (row) row.remove();
                            const list = sheet.querySelector("#start-template-list");
                            if (list && !list.querySelector(".template-row")) {
                                list.innerHTML = '<p class="text-[10px] text-gray-500 font-semibold py-2">Пока нет шаблонов. Создай из последней тренировки.</p>';
                            }
                            showToast("Шаблон удалён");
                        });
                    });
                }
            });

            if (!result) return;
            if (result.type === "resume") {
                resumePendingSession();
                return;
            }
            if (result.type === "create") {
                await createTemplateFromLast();
                return;
            }
            if (result.type === "last" && historyData[0]) {
                startWorkout({ plan: planFromWorkout(historyData[0]) });
                return;
            }
            if (result.type === "template") {
                const template = (settings.templates || []).find(function (t) { return t.id === result.id; });
                if (template) startWorkout({ plan: template.exercises });
                return;
            }
            startWorkout();
        }

        async function startWorkout(options) {
            const opts = options || {};

            if (pendingSession) {
                const ok = await uiConfirm("Есть незавершённая тренировка. Начать новую? Записанные подходы будут потеряны.", {
                    title: "Начать новую?",
                    okLabel: "Начать",
                    danger: true
                });
                if (!ok) return;
                clearStoredSession();
            }

            currentSessionExercises = [];
            currentPlan = (opts.plan || [])
                .filter(function (item) { return item && item.name; })
                .map(function (item) {
                    return {
                        name: canonicalName(item.name),
                        targetSets: Math.max(1, Math.min(20, Number(item.targetSets) || 4))
                    };
                });
            elapsedSeconds = 0;
            currentExercise = "";
            selectOrigin = "new";
            activeExerciseBeforeSelect = "";
            finishing = false;

            updateTimerDisplay();
            const sets = document.getElementById("sets-container");
            if (sets) sets.innerHTML = "";
            document.getElementById("input-weight").value = "";
            document.getElementById("input-reps").value = "";
            setAutofillHint("");

            document.querySelectorAll(".exercise-item").forEach(function (el) { el.classList.remove("selected"); });
            stopRestTimer();

            const list = document.getElementById("exercise-list-container");
            if (list) list.scrollTop = 0;

            startTimer();
            ensureAudio();
            requestWakeLock();

            if (currentPlan.length) {
                currentExercise = currentPlan[0].name;
                const heading = document.getElementById("current-exercise-name");
                if (heading) heading.textContent = displayExerciseName(currentExercise);
                goToExercise();
            } else {
                showScreen("screen-select-exercise");
                updateExerciseNotePreview();
                renderPlanBar();
            }

            renderPlanBar();
            persistActiveSession();
            haptic("medium");
        }

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            workoutStartTime = Date.now() - elapsedSeconds * 1000;
            timerInterval = setInterval(function () {
                elapsedSeconds = Math.floor((Date.now() - workoutStartTime) / 1000);
                updateTimerDisplay();
            }, 1000);
        }

        function updateTimerDisplay() {
            const minutes = Math.floor(elapsedSeconds / 60);
            const seconds = elapsedSeconds % 60;
            const text = minutes + ":" + (seconds < 10 ? "0" : "") + seconds;
            const timer = document.getElementById("timer");
            const timerTop = document.getElementById("timer-top");
            if (timer) timer.textContent = text;
            if (timerTop) timerTop.textContent = text;
        }

        function goToSelect() {
            selectOrigin = currentExercise ? "active" : "new";
            activeExerciseBeforeSelect = currentExercise;
            stopRestTimer();
            persistActiveSession();
            showScreen("screen-select-exercise");
            haptic("light");
        }

        function backFromSelect() {
            if (selectOrigin === "active" && activeExerciseBeforeSelect) {
                currentExercise = activeExerciseBeforeSelect;
                const heading = document.getElementById("current-exercise-name");
                if (heading) heading.textContent = displayExerciseName(currentExercise);
                syncExerciseSelection();
                goToExercise();
                return;
            }
            requestAbortWorkout();
        }

        function requestAbortWorkout() {
            if (!currentSessionExercises.length) {
                abortWorkout();
                return;
            }
            uiConfirm("Прервать тренировку? Все подходы будут потеряны.", { title: "Прервать?", okLabel: "Прервать", danger: true })
                .then(function (ok) { if (ok) abortWorkout(); });
        }

        function abortWorkout() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = null;
            stopRestTimer();
            releaseWakeLock();
            currentSessionExercises = [];
            currentPlan = [];
            currentExercise = "";
            activeExerciseBeforeSelect = "";
            selectOrigin = "new";
            elapsedSeconds = 0;
            updateTimerDisplay();
            const sets = document.getElementById("sets-container");
            if (sets) sets.innerHTML = "";
            clearStoredSession();
            renderPlanBar();
            renderBackupReminder();
            renderResumeBanner();
            showScreen("screen-history");
        }

        function recomputeExercisePRs(exData) {
            const target = canonicalName(exData.name);
            const historical = getBests(target, false);
            const hadRecord = historical.weight > 0 || historical.oneRM > 0;
            let bestWeight = historical.weight;
            let bestOneRM = historical.oneRM;

            exData.sets.forEach(function (set) {
                const weight = parseNum(set.weight);
                const reps = parseNum(set.reps);
                const estimated = estimate1RM(weight, reps);
                const weightPR = hadRecord && isFinite(weight) && weight > bestWeight + 0.0001;
                const oneRMPR = hadRecord && isFinite(reps) && reps > 1 && estimated > bestOneRM + 0.05;
                set.pr = weightPR || oneRMPR;
                set.prType = weightPR ? "weight" : (oneRMPR ? "oneRM" : "");
                if (isFinite(weight) && weight > bestWeight) bestWeight = weight;
                if (estimated > bestOneRM) bestOneRM = estimated;
            });
        }

        function renderSessionSets() {
            const container = document.getElementById("sets-container");
            if (!container) return;
            container.innerHTML = "";
            const exData = currentSessionExercises.find(function (ex) { return ex.name === currentExercise; });
            if (!exData) return;
            exData.sets.forEach(function (set, index) {
                renderSetRow(set, index + 1, exData);
            });
        }

        function renderSetRow(set, index, exData) {
            const container = document.getElementById("sets-container");
            if (!container) return;
            const div = document.createElement("div");
            div.className = "set-row card-glass rounded-xl p-3 flex justify-between items-center text-sm mb-2 editable" +
                (set.pr ? " set-row-pr" : "");
            div.dataset.index = index - 1;
            div.innerHTML =
                '<span class="text-gray-400 font-medium flex items-center gap-2">' +
                    '<span class="w-6 h-6 rounded-lg bg-gray-800/80 border border-gray-700/60 flex items-center justify-center text-[10px] font-black text-gray-400">' + index + '</span>' +
                    'Подход' + (set.pr ? ' <span class="text-base leading-none" title="Новый рекорд">🏆</span>' : '') +
                '</span>' +
                '<span class="flex items-center gap-2">' +
                    '<span class="font-bold text-lg tabular-nums">' + displayNum(set.weight) +
                        ' <span class="text-xs text-gray-400">кг</span> × ' + displayNum(set.reps) + '</span>' +
                    '<span class="set-edit-hint">✎</span>' +
                '</span>';
            div.addEventListener("click", function () {
                openSetEditor(index - 1);
            });
            container.appendChild(div);
            const scroll = document.getElementById("sets-scroll");
            if (scroll) scroll.scrollTop = scroll.scrollHeight;
        }

        function openSetEditor(index) {
            const exData = currentSessionExercises.find(function (ex) { return ex.name === currentExercise; });
            if (!exData || !exData.sets[index]) return;
            const set = exData.sets[index];

            showModal({
                title: "Подход " + (index + 1),
                message: displayExerciseName(currentExercise),
                body: '<div class="flex gap-2">' +
                    '<div class="w-1/2"><label class="input-label" for="edit-set-weight">Вес, кг</label>' +
                    '<input id="edit-set-weight" type="number" inputmode="decimal" step="0.5" class="w-full rounded-xl p-3 text-white font-semibold" value="' + esc(set.weight) + '"></div>' +
                    '<div class="w-1/2"><label class="input-label" for="edit-set-reps">Повторы</label>' +
                    '<input id="edit-set-reps" type="number" inputmode="numeric" step="1" class="w-full rounded-xl p-3 text-white font-semibold" value="' + esc(set.reps) + '"></div>' +
                '</div>',
                actions: [
                    {
                        label: "Удалить подход",
                        danger: true,
                        onClick: function () {
                            exData.sets.splice(index, 1);
                            if (!exData.sets.length) {
                                currentSessionExercises = currentSessionExercises.filter(function (ex) { return ex !== exData; });
                            }
                            recomputeExercisePRs(exData);
                            renderSessionSets();
                            updateLastStatsCard(currentExercise);
                            renderPlanBar();
                            persistActiveSession();
                            updateRestNext();
                            showToast("Подход удалён");
                            haptic("light");
                            return true;
                        }
                    },
                    {
                        label: "Сохранить",
                        primary: true,
                        onClick: function (sheet) {
                            const weightInput = sheet.querySelector("#edit-set-weight");
                            const repsInput = sheet.querySelector("#edit-set-reps");
                            const weight = parseNum(weightInput ? weightInput.value : "");
                            const reps = parseNum(repsInput ? repsInput.value : "");
                            if (!isFinite(weight) || weight < 0) {
                                showToast("Проверь вес", "error");
                                return false;
                            }
                            if (!isFinite(reps) || reps <= 0) {
                                showToast("Проверь повторы", "error");
                                return false;
                            }
                            set.weight = inputNum(weight);
                            set.reps = inputNum(reps);
                            recomputeExercisePRs(exData);
                            renderSessionSets();
                            updateLastStatsCard(currentExercise);
                            renderPlanBar();
                            persistActiveSession();
                            updateRestNext();
                            showToast("Подход обновлён", "success");
                            haptic("success");
                            return true;
                        }
                    },
                    { label: "Отмена", value: null }
                ]
            });
        }

        function adjustWeight(delta) {
            const input = document.getElementById("input-weight");
            const current = parseNum(input.value) || 0;
            let next = current + delta;
            if (next < 0) next = 0;
            input.value = inputNum(next);
            haptic("light");
        }

        function addSet() {
            ensureAudio();
            const weightInput = document.getElementById("input-weight");
            const repsInput = document.getElementById("input-reps");
            const weightRaw = weightInput.value.trim();
            const repsRaw = repsInput.value.trim();

            if (!weightRaw || !repsRaw) {
                uiAlert("Введи вес и количество повторений.", "Не хватает данных");
                return;
            }

            const weightNum = parseNum(weightRaw);
            const repsNum = parseNum(repsRaw);

            if (!isFinite(weightNum) || weightNum < 0) {
                uiAlert("Вес должен быть числом не меньше нуля.", "Проверь вес");
                weightInput.focus();
                return;
            }
            if (!isFinite(repsNum) || repsNum <= 0) {
                uiAlert("Количество повторений должно быть больше нуля.", "Проверь повторы");
                repsInput.focus();
                return;
            }

            let exData = currentSessionExercises.find(function (ex) { return ex.name === currentExercise; });
            if (!exData) {
                exData = { name: currentExercise, sets: [] };
                currentSessionExercises.push(exData);
            }

            const setData = {
                weight: inputNum(weightNum),
                reps: inputNum(repsNum),
                pr: false,
                prType: ""
            };
            exData.sets.push(setData);
            recomputeExercisePRs(exData);
            renderSetRow(setData, exData.sets.length, exData);

            haptic(setData.pr ? "success" : "light");
            if (setData.pr) {
                const message = setData.prType === "weight"
                    ? "🏆 Рекорд по весу: " + displayNum(weightNum) + " кг"
                    : "🏆 Рекорд 1ПМ: ≈ " + Math.round(estimate1RM(weightNum, repsNum)) + " кг";
                setTimeout(function () { showToast(message, "pr", 3200); }, 80);
            }

            prepareNextInputs(exData);
            updateLastStatsCard(currentExercise);
            renderPlanBar();
            persistActiveSession();
            updateRestNext();
            startRestTimer(getRestPref(currentExercise));
        }

        /* ============================================================
           Таймер отдыха
           ============================================================ */

        function getRestPref(exerciseName) {
            const key = canonicalName(exerciseName || "");
            const value = Number(settings.rest[key]);
            if (isFinite(value) && value >= 15 && value <= 600) return Math.round(value);
            return 90;
        }

        function updateRestPrefDisplay() {
            const el = document.getElementById("rest-pref-value");
            const pill = document.getElementById("rest-pref-btn");
            const value = getRestPref(currentExercise);
            if (el) el.textContent = value + " с";
            if (pill) pill.title = "Отдых: " + value + " секунд";
        }

        function changeRestPref(delta) {
            if (!currentExercise) return;
            const key = canonicalName(currentExercise);
            const next = Math.max(15, Math.min(600, getRestPref(currentExercise) + delta));
            settings.rest[key] = next;
            saveSettings();
            updateRestPrefDisplay();
            haptic("light");
        }

        function openRestPrefModal() {
            if (!currentExercise) return;

            showModal({
                title: "Отдых между подходами",
                message: displayExerciseName(currentExercise) + " · запомнится для этого упражнения",
                body: '<div class="flex items-center justify-center gap-5 py-2">' +
                    '<button type="button" data-rest-modal="-15" class="rest-dock-btn" style="width:46px;height:46px;font-size:12px">−15</button>' +
                    '<div class="text-center min-w-[70px]">' +
                        '<div id="rest-modal-value" class="text-3xl font-black text-blue-300 tabular-nums">' + getRestPref(currentExercise) + '</div>' +
                        '<div class="text-[9px] font-black tracking-widest text-gray-500 mt-1">СЕКУНД</div>' +
                    '</div>' +
                    '<button type="button" data-rest-modal="15" class="rest-dock-btn" style="width:46px;height:46px;font-size:12px">+15</button>' +
                '</div>',
                actions: [{ label: "Готово", value: null }],
                onMount: function (sheet) {
                    sheet.querySelectorAll("[data-rest-modal]").forEach(function (btn) {
                        btn.addEventListener("click", function () {
                            changeRestPref(Number(btn.dataset.restModal));
                            const value = sheet.querySelector("#rest-modal-value");
                            if (value) value.textContent = getRestPref(currentExercise);
                        });
                    });
                }
            });
        }

        function startRestTimer(seconds) {
            const secs = Math.max(5, Math.round(Number(seconds) || 90));
            stopRestTimer();

            const dock = document.getElementById("rest-dock");
            if (!dock) return;

            isResting = true;
            restStartTime = Date.now();
            restEndTime = restStartTime + secs * 1000;
            restTimeLeft = secs;

            dock.classList.remove("alert");
            dock.classList.remove("hidden");
            const activeScreen = document.getElementById("screen-active-exercise");
            if (activeScreen) activeScreen.classList.add("resting");
            const caption = document.getElementById("rest-caption");
            if (caption) caption.textContent = "ОТДЫХ";
            updateRestNext();
            renderRest();
            ensureAudio();

            restInterval = setInterval(tickRest, 250);
        }

        function tickRest() {
            if (!isResting) return;
            const msLeft = restEndTime - Date.now();
            if (msLeft <= 0) {
                restTimeLeft = 0;
                renderRest(0);
                finishRest();
                return;
            }
            restTimeLeft = Math.ceil(msLeft / 1000);
            renderRest(msLeft);
        }

        function renderRest(msLeft) {
            const text = document.getElementById("rest-timer-text");
            const progress = document.getElementById("rest-progress");
            if (!text || !progress) return;

            const remaining = msLeft === undefined ? Math.max(0, restEndTime - Date.now()) : Math.max(0, msLeft);
            const seconds = Math.ceil(remaining / 1000);
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            text.textContent = m + ":" + (s < 10 ? "0" : "") + s;

            const total = Math.max(1, restEndTime - restStartTime);
            const elapsed = Math.max(0, Math.min(total, Date.now() - restStartTime));
            progress.style.width = Math.min(100, (elapsed / total) * 100) + "%";
        }

        function finishRest() {
            isResting = false;
            if (restInterval) { clearInterval(restInterval); restInterval = null; }
            restTimeLeft = 0;

            const dock = document.getElementById("rest-dock");
            const caption = document.getElementById("rest-caption");
            const progress = document.getElementById("rest-progress");
            if (dock) dock.classList.add("alert");
            if (caption) caption.textContent = "ОТДЫХ ОКОНЧЕН";
            if (progress) progress.style.width = "100%";

            playRestSound();
            haptic("error");
            let count = 0;
            if (restVibInterval) clearInterval(restVibInterval);
            restVibInterval = setInterval(function () {
                count++;
                if (count >= 3) { clearInterval(restVibInterval); restVibInterval = null; return; }
                haptic("error");
            }, 450);

            if (restHideTimer) clearTimeout(restHideTimer);
            restHideTimer = setTimeout(function () {
                if (!isResting) stopRestTimer();
            }, 6500);
        }

        function adjustRestTime(delta) {
            if (!isResting) {
                if (delta <= 0) return;
                startRestTimer(Math.max(15, restTimeLeft + delta));
                haptic("light");
                return;
            }

            if (restHideTimer) { clearTimeout(restHideTimer); restHideTimer = null; }
            if (restVibInterval) { clearInterval(restVibInterval); restVibInterval = null; }

            const dock = document.getElementById("rest-dock");
            const caption = document.getElementById("rest-caption");
            if (dock) dock.classList.remove("alert");
            if (caption) caption.textContent = "ОТДЫХ";

            restEndTime += delta * 1000;
            if (restEndTime <= Date.now()) {
                restTimeLeft = 0;
                renderRest(0);
                finishRest();
            } else {
                if (!restInterval) restInterval = setInterval(tickRest, 250);
                tickRest();
            }
            haptic("light");
        }

        function stopRestTimer() {
            if (restInterval) { clearInterval(restInterval); restInterval = null; }
            if (restHideTimer) { clearTimeout(restHideTimer); restHideTimer = null; }
            if (restVibInterval) { clearInterval(restVibInterval); restVibInterval = null; }
            isResting = false;

            const dock = document.getElementById("rest-dock");
            const caption = document.getElementById("rest-caption");
            const progress = document.getElementById("rest-progress");
            if (dock) {
                dock.classList.add("hidden");
                dock.classList.remove("alert");
            }
            const activeScreen = document.getElementById("screen-active-exercise");
            if (activeScreen) activeScreen.classList.remove("resting");
            if (caption) caption.textContent = "ОТДЫХ";
            if (progress) progress.style.width = "0%";
        }

        /* ============================================================
           Завершение тренировки
           ============================================================ */

        async function finishWorkout() {
            if (finishing) return;
            if (!currentSessionExercises.length) {
                uiAlert("Ты ещё не добавил ни одного подхода. Тренировка не сохранена.", "Пустая тренировка");
                return;
            }

            finishing = true;
            if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
            stopRestTimer();

            const clockSeconds = workoutStartTime ? Math.floor((Date.now() - workoutStartTime) / 1000) : elapsedSeconds;
            elapsedSeconds = Math.max(elapsedSeconds, clockSeconds);
            updateTimerDisplay();
            const frozenSeconds = elapsedSeconds;

            const totalSets = currentSessionExercises.reduce(function (sum, ex) { return sum + ex.sets.length; }, 0);
            let totalTonnage = 0;
            currentSessionExercises.forEach(function (ex) {
                ex.sets.forEach(function (set) {
                    const w = parseNum(set.weight);
                    const r = parseNum(set.reps);
                    if (isFinite(w) && isFinite(r)) totalTonnage += w * r;
                });
            });
            const minutes = Math.max(1, Math.round(frozenSeconds / 60));

            const summary =
                '<div class="finish-summary">' +
                    '<div><b>' + minutes + '</b><span>мин</span></div>' +
                    '<div><b>' + currentSessionExercises.length + '</b><span>упр</span></div>' +
                    '<div><b>' + esc(formatTonnage(totalTonnage)) + '</b><span>объём</span></div>' +
                '</div>';

            let result = null;
            try {
                result = await showMoodNoteModal({
                    title: "Завершить тренировку",
                    message: "Тренировка сохранится в истории. " + totalSets + " " + plural(totalSets, "подход", "подхода", "подходов") + ".",
                    summaryHtml: summary,
                    saveLabel: "Сохранить"
                });
            } finally {
                finishing = false;
            }

            if (!result) {
                startTimer();
                return;
            }

            saveWorkout(result, frozenSeconds);
        }

        function saveWorkout(moodNote, durationSeconds) {
            const now = new Date();
            const minutes = Math.max(1, Math.round(durationSeconds / 60));

            const exercises = currentSessionExercises.map(function (ex) {
                return {
                    name: canonicalName(ex.name),
                    sets: ex.sets.map(function (set) {
                        return {
                            weight: set.weight,
                            reps: set.reps,
                            pr: !!set.pr
                        };
                    })
                };
            });

            const record = {
                id: Date.now(),
                date: formatFullDate(now),
                dateISO: isoDate(now),
                shortDate: formatShortDate(now),
                duration: minutes + " мин.",
                durationSeconds: durationSeconds,
                mood: moodNote.mood || "",
                note: moodNote.note || "",
                exercises: exercises
            };

            historyData.unshift(record);
            sortHistory();
            persistHistory();

            if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
            stopRestTimer();
            releaseWakeLock();
            currentSessionExercises = [];
            currentPlan = [];
            currentExercise = "";
            activeExerciseBeforeSelect = "";
            selectOrigin = "new";
            elapsedSeconds = 0;
            updateTimerDisplay();
            clearStoredSession();
            renderPlanBar();
            renderResumeBanner();
            renderBackupReminder();

            renderAll();
            showScreen("screen-history");
            const scroll = document.getElementById("history-scroll");
            if (scroll) scroll.scrollTop = 0;

            haptic("success");
            showToast("Тренировка сохранена 💪", "success", 2800);
        }

        function buildWorkoutCard(workout) {

            const dateISO = workout.dateISO || isoFromLegacyDate(workout.date);
            const yesterdayISO = isoDate(new Date(Date.now() - 86400000));
            const dayBadge = dateISO === todayISO() ? "СЕГОДНЯ" : (dateISO === yesterdayISO ? "ВЧЕРА" : "");

            const rows = workout.exercises.map(function (ex) {

                    '<span class="ex-name">' + esc(canonicalName(ex.name)) + '</span>' +

            card.innerHTML =

                        '<div class="hist-meta">' + workout.exercises.length + ' упр · ' + totalSets + ' подх · ' + esc(formatTonnage(tonnage)) +
                            (workout.duration ? ' · ' + esc(workout.duration) : '') + '</div>' +
                    '</div>' +
                    '<div class="hist-right">' +
                        (workout.mood ? '<span class="hist-mood">' + esc(workout.mood) + '</span>' : '') +
                        '<button type="button" class="note-btn' + (workout.note ? ' has-note' : '') + '" title="Заметка и самочувствие" aria-label="Заметка и самочувствие">✎</button>' +
                        (hasMore ? '<span class="chev">▾</span>' : '') +
                    '</div>' +
                '</div>' +
                '<div class="ex-wrap no-transition" style="height:0">' +
                    '<div class="ex-inner">' +
                        rows +
                        (workout.note ? '<div class="hist-note">' + esc(workout.note) + '</div>' : '') +
                    '</div>' +
                '</div>';

            const deleteBtn = document.createElement("button");
            deleteBtn.type = "button";
            deleteBtn.className = "swipe-delete-btn";
            deleteBtn.textContent = "Удалить";
            deleteBtn.addEventListener("click", function (e) {
                e.stopPropagation();
                deleteWorkout(workout.id, wrap);
            });
            card._btn = deleteBtn;

            wrap.appendChild(deleteBtn);
            wrap.appendChild(card);

            const head = card.querySelector(".hist-head");
            head.addEventListener("click", function (e) {
                if (e.target.closest(".note-btn")) return;
                if (hasMore) toggleCard(card);
            });

            card.querySelector(".note-btn").addEventListener("click", function (e) {
                e.stopPropagation();
                editWorkoutNote(workout.id);
            });

            card.addEventListener("click", function (e) {
                const row = e.target.closest(".ex-row");
                if (!row) return;
                e.stopPropagation();

        function getClosedHeight(inner) {
            const rows = inner.querySelectorAll(".ex-row");
            let height = 10;
            for (let i = 0; i < Math.min(3, rows.length); i++) {
                height += rows[i].offsetHeight || ROW_FALLBACK;
            }
            return height;
        }

        function applyCardHeight(wrap, animation) {
            const card = wrap.querySelector(".hist-card");
            const exWrap = wrap.querySelector(".ex-wrap");
            const inner = wrap.querySelector(".ex-inner");
            if (!card || !exWrap || !inner) return;

            if (animation === false) exWrap.classList.add("no-transition");

            const open = exWrap.dataset.open === "1";
            const closed = getClosedHeight(inner);
            const full = Math.max(closed, inner.scrollHeight);

            exWrap.dataset.closed = closed;
            exWrap.dataset.full = full;
            exWrap.style.height = (open ? full : closed) + "px";
            exWrap.classList.toggle("clipped", !open && inner.querySelectorAll(".ex-row").length > 3);
            card.classList.toggle("open", open);

            if (animation === false) {
                requestAnimationFrame(function () { exWrap.classList.remove("no-transition"); });
            }
        }

        function renderHistory() {

            container.innerHTML = "";

            if (!historyData.length) {
                container.innerHTML =
                    '<div class="text-center py-12 px-6">' +
                        '<div class="text-5xl mb-3 opacity-40">🏋️</div>' +

        function recalcCardHeights() {
            const container = document.getElementById("history-container");
            if (!container) return;
            const historyScreen = document.getElementById("screen-history");
            if (historyScreen && historyScreen.classList.contains("hidden")) return;
            container.querySelectorAll(".swipe-wrap").forEach(function (wrap) {

        function toggleCard(card) {
            const wrap = card.closest(".swipe-wrap");
            const exWrap = card.querySelector(".ex-wrap");
            const inner = card.querySelector(".ex-inner");
            const chev = card.querySelector(".chev");
            if (!exWrap || !inner) return;

            const workoutId = wrap ? Number(wrap.dataset.id) : null;
            const isOpen = exWrap.dataset.open === "1";

            if (!isOpen) {
                exWrap.dataset.open = "1";
                card.classList.add("open");
                exWrap.classList.remove("clipped");
                const full = Math.max(getClosedHeight(inner), inner.scrollHeight);
                exWrap.dataset.full = full;
                exWrap.style.height = full + "px";
                if (chev) chev.classList.add("rot");
                if (workoutId && expandedIds) expandedIds.add(workoutId);
                haptic("light");
            } else {
                exWrap.dataset.open = "0";
                card.classList.remove("open");
                const closed = getClosedHeight(inner);
                exWrap.dataset.closed = closed;
                exWrap.style.height = closed + "px";
                if (chev) chev.classList.remove("rot");
                if (workoutId && expandedIds) expandedIds.delete(workoutId);
                setTimeout(function () {
                    if (exWrap.dataset.open === "0" && inner.querySelectorAll(".ex-row").length > 3) {
                        exWrap.classList.add("clipped");
                    }
                }, 300);
                haptic("light");
            }
        }

        function attachSwipe(card) {
            let startX = 0, startY = 0, baseX = 0, tracking = false, horizontal = false, moved = false, pid = null;

            card.addEventListener("pointerdown", function (e) {
                if (e.pointerType === "mouse" && e.button !== 0) return;
                closeOpenSwipe(card);
                tracking = true;
                horizontal = false;
                moved = false;
                pid = e.pointerId;
                startX = e.clientX;
                startY = e.clientY;
                baseX = parseFloat(card.dataset.x || 0);
            });

            card.addEventListener("pointermove", function (e) {
                if (!tracking || e.pointerId !== pid) return;
                const dx = e.clientX - startX;
                const dy = e.clientY - startY;
                if (!horizontal) {
                    if (Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)) { tracking = false; return; }
                    if (Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy)) {
                        horizontal = true;
                        moved = true;
                        try { card.setPointerCapture(pid); } catch (err) {}
                    } else {
                        return;
                    }
                }
                let x = baseX + dx;
                if (x > 0) x = 0;
                if (x < -SWIPE_W - 30) x = -SWIPE_W - 30 + (x + SWIPE_W + 30) * 0.2;
                setCardX(card, x, false);
            });

            function endSwipe(e) {
                if (!tracking || e.pointerId !== pid) return;
                tracking = false;
                if (!horizontal) return;
                const x = parseFloat(card.dataset.x || 0);
                if (x < -SWIPE_W / 2) {
                    setCardX(card, -SWIPE_W, true);
                    openSwipeCard = card;
                    haptic("light");
                } else {
                    setCardX(card, 0, true);
                    if (openSwipeCard === card) openSwipeCard = null;
                }
            }

            card.addEventListener("pointerup", endSwipe);
            card.addEventListener("pointercancel", endSwipe);

            card.addEventListener("click", function (e) {
                if (moved) {
                    e.stopPropagation();
                    e.preventDefault();
                    moved = false;
                    return;
                }
                if (parseFloat(card.dataset.x || 0) < -5) {
                    e.stopPropagation();
                    e.preventDefault();
                    setCardX(card, 0, true);
                    if (openSwipeCard === card) openSwipeCard = null;
                }
            }, true);
        }

        function setCardX(card, x, animate) {
            card.style.transition = animate ? "transform .25s cubic-bezier(.4,0,.2,1)" : "none";
            card.style.transform = "translateX(" + x + "px)";
            card.dataset.x = x;
            if (card._btn) {
                card._btn.style.opacity = Math.min(1, -x / (SWIPE_W * 0.5));
                card._btn.style.pointerEvents = x < -SWIPE_W / 2 ? "auto" : "none";
            }
        }

        function closeOpenSwipe(except) {
            if (openSwipeCard && openSwipeCard !== except) {
                setCardX(openSwipeCard, 0, true);
                openSwipeCard = null;
            }
        }

        function deleteWorkout(id, wrap) {
            const index = historyData.findIndex(function (w) { return w.id === id; });
            if (index < 0) return;

            const removed = historyData[index];
            historyData.splice(index, 1);
            persistHistory();
            expandedIds.delete(id);
            openSwipeCard = null;

            const height = wrap.offsetHeight;
            wrap.style.height = height + "px";
            wrap.classList.add("removing");
            requestAnimationFrame(function () {
                wrap.style.height = "0px";
                wrap.style.opacity = "0";
                wrap.style.marginBottom = "0px";
            });

            if (pendingRenderTimer) clearTimeout(pendingRenderTimer);
            pendingRenderTimer = setTimeout(function () {
                pendingRenderTimer = null;
                renderAll();
            }, 270);

            showUndoBar("Тренировка " + (removed.shortDate || "") + " удалена", function () {
                if (pendingRenderTimer) {
                    clearTimeout(pendingRenderTimer);
                    pendingRenderTimer = null;
                }
                historyData.splice(Math.min(index, historyData.length), 0, removed);
                sortHistory();
                persistHistory();
                renderAll();
                showToast("Тренировка восстановлена", "success");
                haptic("success");
            });
        }

        async function editWorkoutNote(id) {
            const workout = historyData.find(function (w) { return w.id === id; });

            const result = await showMoodNoteModal({

        /* ============================================================
           График
