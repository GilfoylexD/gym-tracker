<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0b1120">
    <link rel="icon" type="image/png" href="icon-512.png">
    <link rel="apple-touch-icon" href="icon-512.png">
    <title>Gym Tracker Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --bg: #0b1120;
            --card: #111827;
            --line: rgba(75, 85, 99, 0.4);
            --blue: #3b82f6;
            --blue-soft: #93c5fd;
            --muted: #64748b;
        }

        * { box-sizing: border-box; }

        html, body { height: 100%; }

        body {
            margin: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            background:
                radial-gradient(1100px 520px at 50% -12%, rgba(37, 99, 235, 0.20), transparent 62%),
                linear-gradient(135deg, #0b1120 0%, #111827 52%, #0f172a 100%);
            background-attachment: fixed;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            height: 100vh;
            height: 100dvh;
        }

        ::-webkit-scrollbar { display: none; }
        * { scrollbar-width: none; }

        .hidden { display: none !important; }

        .screen {
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
            max-width: 480px;
            margin-left: auto;
            margin-right: auto;
            padding: 1rem;
            padding-top: max(3rem, env(safe-area-inset-top, 0px));
            padding-bottom: max(1rem, env(safe-area-inset-bottom, 0px));
        }

        .screen.screen-in {
            animation: screenIn 0.32s cubic-bezier(0.22, 1, 0.36, 1);
        }

        @keyframes screenIn {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        #screen-chart {
            position: absolute;
            inset: 0;
            z-index: 50;
            background: #0f172a;
            margin-left: auto;
            margin-right: auto;
        }

        .btn-primary {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            box-shadow: 0 4px 14px 0 rgba(37, 99, 235, 0.39);
            transition: transform 0.15s ease, filter 0.15s ease;
        }
        .btn-primary:active { transform: scale(0.97); filter: brightness(1.06); }

        .btn-success {
            background: linear-gradient(135deg, #16a34a 0%, #15803d 100%);
            box-shadow: 0 4px 14px 0 rgba(22, 163, 74, 0.39);
            transition: transform 0.15s ease, filter 0.15s ease;
        }
        .btn-success:active { transform: scale(0.97); filter: brightness(1.06); }

        .btn-danger {
            background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%);
            box-shadow: 0 4px 14px 0 rgba(220, 38, 38, 0.39);
            transition: transform 0.15s ease, filter 0.15s ease;
        }
        .btn-danger:active { transform: scale(0.97); filter: brightness(1.06); }

        .card-glass {
            background: linear-gradient(180deg, rgba(31, 41, 55, 0.9) 0%, rgba(17, 24, 39, 0.92) 100%);
            border: 1px solid rgba(75, 85, 99, 0.4);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
        }

        .exercise-item {
            transition: transform 0.18s cubic-bezier(0.4, 0, 0.2, 1), background 0.2s ease, border-color 0.2s ease;
            border: 1px solid rgba(75, 85, 99, 0.3);
            background: rgba(31, 41, 55, 0.4);
            position: relative;
            overflow: hidden;
            width: 100%;
            text-align: left;
            display: flex;
            align-items: center;
            padding: 14px 16px;
            border-radius: 12px;
            color: #f3f4f6;
        }
        .exercise-item:active { transform: scale(0.98); }

        .exercise-item.selected {
            border-color: transparent;
            background: linear-gradient(90deg, rgba(37, 99, 235, 0.25) 0%, rgba(31, 41, 55, 0.6) 100%);
            box-shadow: inset 0 0 20px rgba(59, 130, 246, 0.15), 0 4px 15px rgba(59, 130, 246, 0.1);
        }

        .exercise-item.selected::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background: #3b82f6;
            box-shadow: 2px 0 10px rgba(59, 130, 246, 0.6);
            border-radius: 4px 0 0 4px;
        }

        .exercise-item.selected .circle {
            background-color: #3b82f6;
            border-color: #3b82f6;
            box-shadow: 0 0 12px rgba(59, 130, 246, 0.8);
        }

        .group-header {
            position: sticky;
            top: 0;
            z-index: 8;
            background: linear-gradient(180deg, #0d1424 0%, #0d1424 82%, rgba(13, 20, 36, 0) 100%);
            padding: 14px 2px 10px;
            font-size: 11px;
            font-weight: 900;
            letter-spacing: 0.14em;
            display: flex;
            align-items: center;
            gap: 7px;
        }
        .group-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            flex: 0 0 auto;
            box-shadow: 0 0 8px currentColor;
        }

        input, textarea { font-family: inherit; }
        input {
            background: rgba(17, 24, 39, 0.8) !important;
            border: 1px solid rgba(75, 85, 99, 0.6) !important;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            font-size: 16px;
        }
        input:focus {
            border-color: #3b82f6 !important;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.2);
            outline: none;
        }
        input[type=number]::-webkit-outer-spin-button,
        input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }

        .timer-text {
            text-shadow: 0 0 20px rgba(59, 130, 246, 0.5);
            font-variant-numeric: tabular-nums;
        }

        @keyframes pulse-danger {
            0% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(220, 38, 38, 0); }
            100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0); }
        }

        .rest-timer-alert {
            animation: pulse-danger 1s infinite;
            background: rgba(127, 29, 29, 0.96) !important;
            border-color: #ef4444 !important;
        }
        .rest-timer-alert .rest-progress-bar { background: #ef4444 !important; }

        /* ---------- История ---------- */
        #history-scroll {
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
            scrollbar-width: none;
        }

        .stat-card {
            background: linear-gradient(160deg, rgba(30, 41, 59, 0.82), rgba(17, 24, 39, 0.92));
            border: 1px solid rgba(75, 85, 99, 0.35);
            border-radius: 14px;
            padding: 9px 8px;
            min-width: 0;
        }
        .stat-value {
            font-size: 20px;
            line-height: 1.05;
            font-weight: 900;
            color: #60a5fa;
            letter-spacing: -0.02em;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }
        .stat-label {
            font-size: 9.5px;
            font-weight: 800;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: #64748b;
            margin-top: 4px;
            line-height: 1.25;
        }

        .heat-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }
        .heat-cell {
            height: 22px;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 8.5px;
            font-weight: 800;
            color: #94a3b8;
            background: rgba(55, 65, 81, 0.26);
            font-variant-numeric: tabular-nums;
        }
        .heat-cell.clickable { cursor: pointer; }
        .heat-cell.clickable:active { transform: scale(0.94); }
        .heat-cell.has { color: #fff; }
        .heat-cell.today { box-shadow: inset 0 0 0 1.5px #60a5fa; }
        .heat-legend {
            width: 9px;
            height: 9px;
            border-radius: 2.5px;
            display: inline-block;
        }

        .swipe-wrap {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            animation: cardIn 0.38s cubic-bezier(0.22, 1, 0.36, 1) backwards;
        }
        @keyframes cardIn {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .swipe-wrap .swipe-card {
            position: relative;
            z-index: 1;
            touch-action: pan-y;
            will-change: transform;
            user-select: none;
            -webkit-user-select: none;
        }
        .swipe-wrap.removing {
            transition: height 0.25s ease, margin 0.25s ease, opacity 0.25s ease;
            overflow: hidden;
        }
        .swipe-delete-btn {
            position: absolute;
            top: 0;
            bottom: 0;
            right: 0;
            width: 92px;
            z-index: 0;
            opacity: 0;
            pointer-events: none;
            background: linear-gradient(135deg, #dc2626, #b91c1c);
            color: #fff;
            font-weight: 800;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 0;
            border-radius: 0 16px 16px 0;
        }

        .hist-card {
            background: linear-gradient(180deg, rgba(30, 41, 59, 0.94), rgba(15, 23, 42, 0.97));
            border: 1px solid rgba(75, 85, 99, 0.34);
            border-left: 3px solid var(--g, #3b82f6);
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.22);
            overflow: hidden;
        }
        .hist-head {
            padding: 13px 14px 9px;
            display: flex;
            align-items: flex-start;
            gap: 8px;
            cursor: pointer;
        }
        .hist-date {
            font-size: 13.5px;
            font-weight: 900;
            color: #93c5fd;
            line-height: 1.3;
            word-break: break-word;
        }
        .hist-meta {
            font-size: 10px;
            color: #6b7280;
            font-weight: 700;
            margin-top: 3px;
            letter-spacing: 0.01em;
            word-break: break-word;
        }
        .hist-right {
            display: flex;
            align-items: center;
            gap: 5px;
            flex-shrink: 0;
            margin-top: -2px;
        }
        .hist-mood { font-size: 18px; line-height: 1; }
        .note-btn {
            width: 33px;
            height: 33px;
            border-radius: 9px;
            background: rgba(55, 65, 81, 0.38);
            border: 1px solid rgba(75, 85, 99, 0.25);
            font-size: 14px;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.8;
            transition: transform 0.12s ease;
            color: #cbd5e1;
        }
        .note-btn.has-note {
            background: rgba(245, 158, 11, 0.12);
            border-color: rgba(245, 158, 11, 0.35);
            color: #fbbf24;
            opacity: 1;
        }
        .note-btn:active { transform: scale(0.9); }
        .chev {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #64748b;
            font-size: 13px;
            transition: transform 0.25s ease;
        }
        .chev.rot { transform: rotate(180deg); }

        .ex-wrap {
            overflow: hidden;
            transition: height 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }
        .ex-wrap.no-transition { transition: none !important; }
        .ex-wrap.clipped::after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 22px;
            background: linear-gradient(to bottom, rgba(15, 23, 42, 0), rgba(15, 23, 42, 0.96));
            pointer-events: none;
        }
        .ex-inner { padding: 0 14px 11px; }
        .ex-row {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 6px 0;
            min-height: 31px;
            cursor: pointer;
        }
        .ex-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            flex: 0 0 auto;
            box-shadow: 0 0 6px currentColor;
        }
        .ex-name {
            font-size: 12px;
            font-weight: 700;
            color: #d1d5db;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1 1 auto;
            min-width: 0;
        }
        .ex-sets {
            font-size: 10.5px;
            color: #94a3b8;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 57%;
            flex: 0 1 auto;
            text-align: right;
        }
        .hist-card.open .ex-sets {
            white-space: normal;
            overflow: visible;
            max-width: 58%;
            line-height: 1.35;
        }
        .hist-note {
            margin-top: 8px;
            padding: 8px 10px;
            border-radius: 10px;
            background: rgba(37, 99, 235, 0.09);
            border: 1px solid rgba(59, 130, 246, 0.16);
            font-size: 11px;
            color: #cbd5e1;
            line-height: 1.45;
            white-space: pre-wrap;
            word-break: break-word;
        }

        /* ---------- Сеты ---------- */
        .set-row-pr {
            border-color: rgba(245, 158, 11, 0.55) !important;
            background: linear-gradient(90deg, rgba(245, 158, 11, 0.13), rgba(31, 41, 55, 0.65)) !important;
        }
        .set-chip {
            background: rgba(37, 99, 235, 0.12);
            border: 1px solid rgba(59, 130, 246, 0.26);
            color: #93c5fd;
            font-size: 10.5px;
            font-weight: 800;
            padding: 4px 8px;
            border-radius: 8px;
            display: inline-flex;
            align-items: center;
            gap: 3px;
            font-variant-numeric: tabular-nums;
            transition: transform 0.12s ease;
        }
        .set-chip:active { transform: scale(0.95); }
        .record-badge {
            background: rgba(245, 158, 11, 0.12);
            border: 1px solid rgba(245, 158, 11, 0.3);
            color: #fcd34d;
            font-size: 9px;
            font-weight: 900;
            padding: 3px 7px;
            border-radius: 7px;
            letter-spacing: 0.02em;
            white-space: nowrap;
        }
        .rest-pref-btn {
            width: 26px;
            height: 26px;
            border-radius: 8px;
            background: rgba(55, 65, 81, 0.5);
            color: #cbd5e1;
            font-size: 11px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .rest-pref-btn:active { transform: scale(0.9); }
        .input-label {
            display: block;
            font-size: 9.5px;
            font-weight: 900;
            letter-spacing: 0.09em;
            color: #64748b;
            margin: 0 0 4px 4px;
            text-transform: uppercase;
        }
        .hint-line { min-height: 14px; }

        .rest-progress-track {
            height: 3px;
            border-radius: 999px;
            background: rgba(75, 85, 99, 0.45);
            overflow: hidden;
            margin-top: 8px;
        }
        .rest-progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #3b82f6, #60a5fa);
            border-radius: 999px;
            transition: width 0.2s linear;
        }

        /* ---------- Тосты / Undo ---------- */
        #toast-root {
            position: fixed;
            top: calc(env(safe-area-inset-top, 0px) + 54px);
            left: 0;
            right: 0;
            margin-left: auto;
            margin-right: auto;
            max-width: 480px;
            z-index: 120;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            pointer-events: none;
            padding: 0 16px;
        }
        .toast {
            background: rgba(15, 23, 42, 0.97);
            border: 1px solid rgba(75, 85, 99, 0.6);
            color: #e5e7eb;
            font-size: 12px;
            font-weight: 700;
            padding: 9px 14px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.45);
            opacity: 0;
            transform: translateY(-8px) scale(0.96);
            transition: opacity 0.22s ease, transform 0.22s ease;
            max-width: 100%;
            text-align: center;
        }
        .toast.show { opacity: 1; transform: none; }
        .toast.success { border-color: rgba(34, 197, 94, 0.5); color: #bbf7d0; }
        .toast.error { border-color: rgba(239, 68, 68, 0.55); color: #fecaca; }
        .toast.pr {
            border-color: rgba(245, 158, 11, 0.65);
            color: #fde68a;
            background: linear-gradient(135deg, rgba(120, 53, 15, 0.96), rgba(15, 23, 42, 0.98));
        }

        #undo-bar {
            position: fixed;
            left: 50%;
            width: calc(100% - 24px);
            max-width: 456px;
            bottom: calc(78px + env(safe-area-inset-bottom, 0px));
            z-index: 70;
            background: rgba(15, 23, 42, 0.98);
            border: 1px solid rgba(75, 85, 99, 0.6);
            border-radius: 14px;
            padding: 10px 12px 8px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
            opacity: 0;
            transform: translate(-50%, 16px);
            pointer-events: none;
            transition: opacity 0.24s ease, transform 0.24s ease;
            overflow: hidden;
        }
        #undo-bar.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
        .undo-progress {
            height: 2px;
            background: rgba(75, 85, 99, 0.4);
            border-radius: 999px;
            margin-top: 8px;
            overflow: hidden;
        }
        .undo-progress > div {
            height: 100%;
            width: 100%;
            background: #3b82f6;
            border-radius: 999px;
        }

        /* ---------- Модалки ---------- */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(2, 6, 23, 0.72);
            backdrop-filter: blur(3px);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.18s ease;
            z-index: 100;
        }
        .modal-backdrop.show { opacity: 1; }
        .modal-sheet {
            width: 100%;
            max-width: 430px;
            background: #0f172a;
            border: 1px solid rgba(75, 85, 99, 0.5);
            border-bottom: 0;
            border-radius: 22px 22px 0 0;
            padding: 12px 18px calc(18px + env(safe-area-inset-bottom, 0px));
            transform: translateY(24px);
            transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);
            max-height: 88vh;
            overflow-y: auto;
        }
        .modal-backdrop.show .modal-sheet { transform: none; }
        @media (min-width: 480px) {
            .modal-backdrop { align-items: center; }
            .modal-sheet {
                border-radius: 22px;
                border-bottom: 1px solid rgba(75, 85, 99, 0.5);
            }
        }
        .modal-grab {
            width: 40px;
            height: 4px;
            border-radius: 99px;
            background: #334155;
            margin: 0 auto 14px;
        }
        .modal-title {
            font-size: 18px;
            font-weight: 900;
            line-height: 1.25;
            margin: 0 0 6px;
        }
        .modal-message {
            font-size: 12.5px;
            color: #94a3b8;
            line-height: 1.5;
            margin: 0 0 12px;
            white-space: pre-line;
        }
        .modal-label {
            font-size: 9px;
            font-weight: 900;
            letter-spacing: 0.11em;
            color: #64748b;
            margin: 12px 0 6px;
        }
        .modal-actions {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 16px;
        }
        .modal-actions.two {
            display: grid;
            grid-template-columns: 1fr 1fr;
        }
        .modal-btn {
            width: 100%;
            padding: 13px 14px;
            border-radius: 13px;
            font-size: 13px;
            font-weight: 800;
            transition: transform 0.12s ease, filter 0.12s ease;
            border: 0;
            line-height: 1.2;
        }
        .modal-btn:active { transform: scale(0.98); filter: brightness(1.1); }
        .modal-btn.primary {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #fff;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.3);
        }
        .modal-btn.danger {
            background: linear-gradient(135deg, #b91c1c, #991b1b);
            color: #fff;
        }
        .modal-btn.ghost {
            background: rgba(51, 65, 85, 0.45);
            border: 1px solid rgba(71, 85, 105, 0.6);
            color: #cbd5e1;
        }
        .mood-row {
            display: flex;
            gap: 6px;
            justify-content: space-between;
        }
        .mood-btn {
            flex: 1;
            height: 46px;
            border-radius: 12px;
            background: rgba(51, 65, 85, 0.4);
            border: 1px solid transparent;
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
        }
        .mood-btn.active {
            background: rgba(37, 99, 235, 0.2);
            border-color: rgba(59, 130, 246, 0.7);
            transform: scale(1.04);
        }
        .note-input {
            width: 100%;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(75, 85, 99, 0.6);
            border-radius: 12px;
            padding: 11px 12px;
            color: #e5e7eb;
            font-size: 16px;
            line-height: 1.4;
            resize: none;
            outline: none;
        }
        .note-input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.12);
        }
        .finish-summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-bottom: 4px;
        }
        .finish-summary > div {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(75, 85, 99, 0.3);
            border-radius: 11px;
            padding: 8px 6px;
            text-align: center;
            min-width: 0;
        }
        .finish-summary b {
            display: block;
            font-size: 14px;
            color: #93c5fd;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }
        .finish-summary span {
            font-size: 8px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: #64748b;
            font-weight: 800;
        }
        .data-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
        }
        .data-stats > div {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(75, 85, 99, 0.3);
            border-radius: 11px;
            padding: 9px 6px;
            text-align: center;
        }
        .data-stats b {
            display: block;
            font-size: 15px;
            color: #93c5fd;
            font-variant-numeric: tabular-nums;
        }
        .data-stats span {
            font-size: 8px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: #64748b;
            font-weight: 800;
        }

        /* ---------- Новые элементы ---------- */
        .resume-banner {
            background: linear-gradient(135deg, rgba(37, 99, 235, 0.2), rgba(30, 41, 59, 0.9));
            border: 1px solid rgba(59, 130, 246, 0.35);
            border-radius: 14px;
            padding: 10px 12px;
            margin-bottom: 10px;
        }
        .backup-banner {
            background: rgba(245, 158, 11, 0.08);
            border: 1px solid rgba(245, 158, 11, 0.22);
            border-radius: 11px;
            padding: 7px 10px;
            margin-bottom: 9px;
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 10px;
            color: #fcd34d;
            font-weight: 700;
        }

        .plan-bar {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding: 0 0 6px;
            margin-bottom: 8px;
            flex-shrink: 0;
            scrollbar-width: none;
        }
        .plan-chip {
            flex: 0 0 auto;
            border: 1px solid rgba(75, 85, 99, 0.45);
            background: rgba(31, 41, 55, 0.6);
            color: #9ca3af;
            border-radius: 999px;
            padding: 5px 9px;
            font-size: 10px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 4px;
            max-width: 160px;
            transition: transform 0.12s ease, border-color 0.15s ease;
        }
        .plan-chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .plan-chip em {
            font-style: normal;
            font-size: 8px;
            font-weight: 700;
            opacity: 0.65;
            flex-shrink: 0;
        }
        .plan-chip.active {
            border-color: rgba(59, 130, 246, 0.7);
            background: rgba(37, 99, 235, 0.2);
            color: #bfdbfe;
        }
        .plan-chip.done { color: #86efac; border-color: rgba(34, 197, 94, 0.3); }
        .plan-chip:active { transform: scale(0.96); }

        .rest-dock {
            margin-top: 6px;
            border-radius: 13px;
            border: 1px solid rgba(59, 130, 246, 0.45);
            background: linear-gradient(135deg, rgba(30, 58, 138, 0.45), rgba(15, 23, 42, 0.96));
            padding: 6px 9px 6px;
            flex-shrink: 0;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
        }
        .rest-dock.alert {
            animation: pulse-danger 1s infinite;
            background: rgba(127, 29, 29, 0.96) !important;
            border-color: #ef4444 !important;
        }
        .rest-dock.alert .rest-progress-bar { background: #ef4444 !important; }
        .rest-dock-time {
            font-size: 20px;
            line-height: 1;
            font-weight: 900;
            color: #93c5fd;
            font-variant-numeric: tabular-nums;
        }
        .rest-dock-label {
            font-size: 7.5px;
            font-weight: 900;
            letter-spacing: 0.14em;
            color: #64748b;
            text-transform: uppercase;
        }
        .rest-dock-next {
            font-size: 9.5px;
            line-height: 1.25;
            color: #cbd5e1;
            font-weight: 700;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }
        .rest-dock-btn {
            width: 32px;
            height: 32px;
            border-radius: 9px;
            background: rgba(51, 65, 85, 0.65);
            color: #e2e8f0;
            font-size: 9.5px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .rest-dock-btn.danger { background: rgba(220, 38, 38, 0.22); color: #fca5a5; }
        .rest-dock-btn:active { transform: scale(0.9); }

        .exercise-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 6px;
        }
        .exercise-note-btn {
            flex: 0 0 auto;
            width: 30px;
            height: 30px;
            border-radius: 9px;
            border: 1px solid rgba(75, 85, 99, 0.35);
            background: rgba(55, 65, 81, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            color: #cbd5e1;
        }
        .exercise-note-btn.has-note { color: #fbbf24; border-color: rgba(245, 158, 11, 0.35); background: rgba(245, 158, 11, 0.1); }
        .rest-pill {
            flex: 0 0 auto;
            height: 30px;
            padding: 0 8px;
            border-radius: 9px;
            border: 1px solid rgba(75, 85, 99, 0.35);
            background: rgba(55, 65, 81, 0.35);
            font-size: 9px;
            font-weight: 800;
            color: #cbd5e1;
            display: flex;
            align-items: center;
            gap: 3px;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }
        .note-preview {
            background: rgba(37, 99, 235, 0.08);
            border: 1px solid rgba(59, 130, 246, 0.16);
            border-radius: 9px;
            padding: 6px 8px;
            font-size: 10px;
            color: #cbd5e1;
            line-height: 1.4;
            margin-bottom: 8px;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .progression-hint {
            margin-top: 7px;
            font-size: 10px;
            line-height: 1.35;
            font-weight: 700;
            color: #86efac;
        }
        .progression-hint.neutral { color: #64748b; }
        .progression-hint .suggest {
            color: #fcd34d;
            font-weight: 900;
        }

        .month-sep {
            font-size: 9px;
            font-weight: 900;
            letter-spacing: 0.16em;
            color: #475569;
            padding: 10px 4px 2px;
            text-transform: uppercase;
        }
        .today-badge {
            display: inline-block;
            font-size: 7.5px;
            font-weight: 900;
            letter-spacing: 0.08em;
            color: #86efac;
            background: rgba(34, 197, 94, 0.12);
            border: 1px solid rgba(34, 197, 94, 0.25);
            border-radius: 5px;
            padding: 1px 5px;
            margin-left: 6px;
            vertical-align: 1px;
        }
        .hist-card.flash {
            animation: flashCard 1.4s ease;
        }
        @keyframes flashCard {
            0%, 100% { box-shadow: 0 4px 20px rgba(0, 0, 0, 0.22); }
            25% { box-shadow: 0 0 0 2px rgba(96, 165, 250, 0.75), 0 0 30px rgba(59, 130, 246, 0.35); }
        }

        .analytics-tabs {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            background: rgba(30, 41, 59, 0.55);
            border: 1px solid rgba(75, 85, 99, 0.3);
            border-radius: 12px;
            padding: 3px;
            margin-bottom: 12px;
            flex-shrink: 0;
        }
        .analytics-tab {
            border-radius: 9px;
            padding: 7px 4px;
            font-size: 10px;
            font-weight: 800;
            color: #94a3b8;
        }
        .analytics-tab.active {
            background: rgba(37, 99, 235, 0.25);
            color: #bfdbfe;
            box-shadow: inset 0 0 0 1px rgba(59, 130, 246, 0.35);
        }
        .record-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 9px 10px;
            border-radius: 11px;
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(75, 85, 99, 0.25);
            margin-bottom: 6px;
        }
        .record-row:active { transform: scale(0.99); }
        .record-name { font-size: 11.5px; font-weight: 800; color: #e5e7eb; }
        .record-meta { font-size: 9px; color: #64748b; font-weight: 600; margin-top: 2px; }
        .record-value { margin-left: auto; text-align: right; flex-shrink: 0; }
        .record-weight { font-size: 13px; font-weight: 900; color: #fcd34d; font-variant-numeric: tabular-nums; }
        .record-orm { font-size: 8.5px; color: #94a3b8; font-weight: 700; }

        .volume-row { margin-bottom: 10px; }
        .volume-head { display: flex; justify-content: space-between; font-size: 10px; font-weight: 800; color: #cbd5e1; margin-bottom: 4px; }
        .volume-track { height: 8px; border-radius: 999px; background: rgba(55, 65, 81, 0.45); overflow: hidden; }
        .volume-fill { height: 100%; border-radius: 999px; min-width: 2px; }
        .volume-sub { font-size: 8.5px; color: #64748b; margin-top: 3px; font-weight: 600; }

        .body-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 10px;
            border-radius: 10px;
            background: rgba(30, 41, 59, 0.45);
            border: 1px solid rgba(75, 85, 99, 0.22);
            margin-bottom: 5px;
            font-size: 11px;
        }
        .body-row b { color: #93c5fd; font-variant-numeric: tabular-nums; }

        .template-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 11px;
            border-radius: 12px;
            background: rgba(30, 41, 59, 0.55);
            border: 1px solid rgba(75, 85, 99, 0.3);
            margin-bottom: 6px;
            text-align: left;
            width: 100%;
        }
        .template-row:active { transform: scale(0.99); }
        .template-name { font-size: 12px; font-weight: 800; color: #e5e7eb; }
        .template-meta { font-size: 9px; color: #64748b; font-weight: 600; margin-top: 2px; }
        .template-del {
            flex: 0 0 auto;
            width: 30px;
            height: 30px;
            border-radius: 8px;
            background: rgba(220, 38, 38, 0.12);
            color: #fca5a5;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .custom-del {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: 30px;
            height: 30px;
            border-radius: 9px;
            background: rgba(220, 38, 38, 0.14);
            color: #fca5a5;
            font-size: 12px;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
        }
        .exercise-row-wrap { position: relative; margin-bottom: 8px; }
        .exercise-row-wrap .exercise-item { margin-bottom: 0; }
        .exercise-row-wrap.has-custom .exercise-item { padding-right: 48px; }

        .switch-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 10px 0;
            border-bottom: 1px solid rgba(75, 85, 99, 0.25);
        }
        .switch-row:last-child { border-bottom: 0; }
        .switch-label { font-size: 11.5px; font-weight: 700; color: #e5e7eb; }
        .switch-sub { font-size: 9px; color: #64748b; margin-top: 2px; }
        .switch-btn {
            flex: 0 0 auto;
            width: 44px;
            height: 25px;
            border-radius: 999px;
            background: rgba(71, 85, 105, 0.6);
            position: relative;
            transition: background 0.2s ease;
        }
        .switch-btn::after {
            content: '';
            position: absolute;
            width: 19px;
            height: 19px;
            border-radius: 50%;
            background: #e2e8f0;
            top: 3px;
            left: 3px;
            transition: transform 0.2s ease;
        }
        .switch-btn.on { background: #2563eb; }
        .switch-btn.on::after { transform: translateX(19px); }

        .snapshot-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 9px 10px;
            border-radius: 11px;
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(75, 85, 99, 0.25);
            margin-bottom: 6px;
        }
        .snapshot-row .meta { min-width: 0; flex: 1; }
        .snapshot-row .name { font-size: 11px; font-weight: 800; color: #e5e7eb; }
        .snapshot-row .date { font-size: 9px; color: #64748b; margin-top: 2px; }
        .snap-btn {
            font-size: 9px;
            font-weight: 800;
            padding: 5px 8px;
            border-radius: 7px;
            background: rgba(37, 99, 235, 0.18);
            color: #93c5fd;
            flex-shrink: 0;
        }
        .snap-del { color: #fca5a5; background: rgba(220, 38, 38, 0.12); }

        .plate-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid rgba(75,85,99,.2); font-size: 12px; }
        .plate-row:last-child { border-bottom: 0; }
        .plate-weight { font-weight: 900; color: #93c5fd; font-variant-numeric: tabular-nums; }
        .plate-values { color: #e5e7eb; font-weight: 700; text-align: right; }
        .plate-muted { color: #64748b; font-size: 10px; }

        .mode-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 3px;
            background: rgba(30, 41, 59, 0.55);
            border: 1px solid rgba(75, 85, 99, 0.3);
            border-radius: 11px;
            padding: 3px;
            margin-bottom: 10px;
            flex-shrink: 0;
        }
        .mode-btn {
            border-radius: 8px;
            padding: 6px 2px;
            font-size: 9px;
            font-weight: 800;
            color: #94a3b8;
        }
        .mode-btn.active { background: rgba(37, 99, 235, 0.25); color: #bfdbfe; }

        .set-row { transition: border-color 0.15s ease, background 0.15s ease; }
        .set-row.editable:active { transform: scale(0.99); }
        .set-edit-hint { color: #475569; font-size: 10px; flex-shrink: 0; }

        .input-action {
            font-size: 8.5px;
            font-weight: 900;
            letter-spacing: 0.06em;
            color: #93c5fd;
            background: rgba(37, 99, 235, 0.12);
            border: 1px solid rgba(59, 130, 246, 0.25);
            border-radius: 6px;
            padding: 2px 6px;
        }

        @media (max-width: 360px) {
            .stat-label { font-size: 8.5px; }
            .rest-dock-next { display: none; }
        }

        @media (max-height: 700px) {
            #timer { font-size: 2.5rem; }
            #screen-active-exercise.resting #plan-bar { display: none; }
            .screen { padding-top: max(2.5rem, env(safe-area-inset-top, 0px)); }
            #heat-legend { display: none; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-delay: 0ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>

    <!-- ЭКРАН 1: История -->
    <div id="screen-history" class="screen hidden">
        <div class="flex justify-between items-center mb-3 flex-shrink-0">
            <div>
                <h1 class="text-2xl font-black tracking-wide text-gray-200">ИСТОРИЯ</h1>
                <p id="history-subtitle" class="text-[10px] text-gray-500 font-bold tracking-wider mt-0.5">ДНЕВНИК ТРЕНИРОВОК</p>
            </div>
            <div class="flex items-center gap-2 flex-shrink-0">
                <button type="button" onclick="showAnalytics()" title="Аналитика и рекорды" aria-label="Аналитика и рекорды"
                    class="text-base bg-gray-800/80 border border-gray-600/60 w-10 h-10 rounded-xl hover:bg-gray-700 active:scale-95 transition flex items-center justify-center">📊</button>
                <button type="button" onclick="openDataSheet()" title="Данные и резервная копия" aria-label="Данные и резервная копия"
                    class="text-sm bg-gray-800/80 border border-gray-600/60 px-3 h-10 rounded-xl hover:bg-gray-700 active:scale-95 transition flex items-center gap-1.5">
                    <span class="text-base leading-none">💾</span>
                    <span class="text-[9px] font-black tracking-widest text-gray-300">ДАННЫЕ</span>
                </button>
            </div>
        </div>

        <div id="history-scroll" class="flex-grow overflow-y-auto min-h-0 pb-1">
            <div id="stats-row" class="grid grid-cols-3 gap-2 mb-3"></div>
            <div id="resume-banner" class="resume-banner hidden"></div>
            <div id="backup-banner" class="backup-banner hidden"></div>

            <div class="card-glass rounded-2xl p-3 mb-4">
                <div class="flex items-center justify-between mb-2">
                    <span class="text-[10px] font-black tracking-widest text-gray-400">АКТИВНОСТЬ</span>
                    <div class="flex items-center gap-1">
                        <button type="button" onclick="changeHeatMonth(-1)" aria-label="Предыдущий месяц"
                            class="w-9 h-9 rounded-lg bg-gray-800/70 border border-gray-700/60 text-gray-300 text-base active:scale-90 transition flex items-center justify-center">‹</button>
                        <span id="heat-title" class="text-[11px] font-bold text-gray-300 w-[92px] text-center">—</span>
                        <button type="button" onclick="changeHeatMonth(1)" aria-label="Следующий месяц"
                            class="w-9 h-9 rounded-lg bg-gray-800/70 border border-gray-700/60 text-gray-300 text-base active:scale-90 transition flex items-center justify-center">›</button>
                    </div>
                </div>
                <div class="grid grid-cols-7 gap-1 mb-1 text-center">
                    <span class="text-[9px] font-bold text-gray-600">ПН</span>
                    <span class="text-[9px] font-bold text-gray-600">ВТ</span>
                    <span class="text-[9px] font-bold text-gray-600">СР</span>
                    <span class="text-[9px] font-bold text-gray-600">ЧТ</span>
                    <span class="text-[9px] font-bold text-gray-600">ПТ</span>
                    <span class="text-[9px] font-bold text-gray-600">СБ</span>
                    <span class="text-[9px] font-bold text-gray-600">ВС</span>
                </div>
                <div id="heat-grid" class="heat-grid"></div>
                <div id="heat-legend" class="flex items-center justify-end gap-1 mt-2">
                    <span class="text-[8.5px] text-gray-600 font-bold mr-0.5">меньше</span>
                    <span class="heat-legend" style="background: rgba(55,65,81,.26)"></span>
                    <span class="heat-legend" style="background: rgba(37,99,235,.28)"></span>
                    <span class="heat-legend" style="background: rgba(37,99,235,.5)"></span>
                    <span class="heat-legend" style="background: rgba(37,99,235,.75)"></span>
                    <span class="heat-legend" style="background: #3b82f6"></span>
                    <span class="text-[8.5px] text-gray-600 font-bold ml-0.5">больше</span>
                </div>
            </div>

            <div id="history-container" class="space-y-3"></div>
        </div>

        <button type="button" onclick="openStartSheet()" class="btn-primary mt-3 text-white font-black py-4 rounded-2xl text-lg tracking-wider flex-shrink-0">СТАРТ</button>
    </div>

    <!-- ЭКРАН 2: Выбор упражнения -->
    <div id="screen-select-exercise" class="screen hidden">
        <div class="flex items-center justify-between mb-4 flex-shrink-0">
            <button type="button" onclick="backFromSelect()" class="text-gray-400 hover:text-white pb-2 text-sm font-semibold">← Назад</button>
            <h1 class="text-lg font-bold text-gray-200">Упражнение</h1>
            <div class="text-xl font-mono font-bold text-blue-400 timer-text" id="timer-top">0:00</div>
        </div>

        <div class="flex-grow overflow-y-auto min-h-0 pr-1 pb-4" id="exercise-list-container"></div>
        <button type="button" onclick="goToExercise()" class="btn-success mt-2 text-white font-black py-4 rounded-2xl text-lg tracking-wider flex-shrink-0">ПРОДОЛЖИТЬ</button>
    </div>

    <!-- ЭКРАН 3: Выполнение -->
    <div id="screen-active-exercise" class="screen hidden relative">

        <div class="flex justify-between items-start mb-4 flex-shrink-0">
            <div>
                <div class="text-[9px] font-black tracking-widest text-gray-500 mb-0.5">ТРЕНИРОВКА</div>
                <div class="text-5xl font-mono font-black tracking-tighter text-blue-400 timer-text" id="timer">0:00</div>
            </div>
            <button type="button" onclick="finishWorkout()" class="btn-danger px-4 py-3 rounded-xl text-xs text-white font-bold shadow-lg mt-1">ЗАВЕРШИТЬ</button>
        </div>

        <div id="plan-bar" class="plan-bar hidden"></div>

        <div class="card-glass rounded-2xl p-3.5 mb-3 flex-shrink-0" id="last-stats-card">
            <div class="flex items-center justify-between mb-1.5">
                <p class="text-[9px] text-gray-400 font-black tracking-widest">ПРОШЛЫЙ РАЗ</p>
                <span id="record-badge" class="record-badge hidden"></span>
            </div>
            <div id="last-stats" class="flex flex-wrap gap-1.5 min-h-[26px] items-center"></div>
            <p id="progression-hint" class="progression-hint neutral"></p>
        </div>

        <div class="exercise-head">
            <h3 class="text-[10px] font-bold text-gray-400 uppercase tracking-widest" id="current-exercise-name">Упражнение</h3>
            <div class="flex items-center gap-1.5">
                <button type="button" id="rest-pref-btn" onclick="openRestPrefModal()" class="rest-pill" title="Время отдыха">⏱ <span id="rest-pref-value">90 с</span></button>
                <button type="button" id="exercise-note-btn" onclick="openExerciseNote()" class="exercise-note-btn" title="Заметка к упражнению" aria-label="Заметка к упражнению">📝</button>
            </div>
        </div>
        <div id="exercise-note-preview" class="note-preview hidden"></div>

        <div class="flex-grow overflow-y-auto min-h-0" id="sets-scroll">
            <div id="sets-container" class="space-y-2"></div>
        </div>

        <div id="rest-dock" class="rest-dock hidden">
            <div class="flex items-center gap-2">
                <div class="min-w-[54px]">
                    <div class="rest-dock-label" id="rest-caption">ОТДЫХ</div>
                    <div class="rest-dock-time" id="rest-timer-text">1:30</div>

        function defaultSettings() {
            return {
                rest: {},
                lastBackup: 0,
                legacyRestoreVersion: 0,
                sound: true,
                keepAwake: true,
                exerciseNotes: {},
                customExercises: [],
                templates: [],
                bodyWeights: [],
                backupReminderSnooze: 0
            };
        }

        function normalizeSettings(raw) {
            const result = defaultSettings();
            if (!raw || typeof raw !== "object") return result;

            result.rest = (raw.rest && typeof raw.rest === "object") ? raw.rest : {};
            result.lastBackup = Number(raw.lastBackup) || 0;
            result.legacyRestoreVersion = Number(raw.legacyRestoreVersion) || 0;
            result.sound = raw.sound !== false;
            result.keepAwake = raw.keepAwake !== false;
            result.backupReminderSnooze = Number(raw.backupReminderSnooze) || 0;

            if (raw.exerciseNotes && typeof raw.exerciseNotes === "object") {
                Object.keys(raw.exerciseNotes).forEach(function (key) {
                    if (key === "__proto__" || key === "constructor" || key === "prototype") return;
                    const value = String(raw.exerciseNotes[key] || "").trim();
                    if (value) result.exerciseNotes[canonicalName(key)] = value.slice(0, 500);
                });
            }

            if (Array.isArray(raw.customExercises)) {
                result.customExercises = raw.customExercises
                    .filter(function (item) { return item && typeof item === "object"; })
                    .map(function (item) {
                        return {
                            name: String(item.name || "").trim().slice(0, 80),
                            group: GROUP_COLORS[item.group] ? item.group : "ДРУГОЕ"
                        };
                    })
                    .filter(function (item) { return item.name; });
            }

            if (Array.isArray(raw.templates)) {
                result.templates = raw.templates
                    .filter(function (item) { return item && typeof item === "object" && Array.isArray(item.exercises); })
                    .map(function (item) {
                        return {
                            id: Number(item.id) || Date.now() + Math.floor(Math.random() * 100000),

                                        targetSets: Math.max(1, Math.min(20, Number(ex.targetSets) || 4))
                                    };

                        };
                    })
                    .filter(function (item) { return item.exercises.length > 0; });

                    .filter(function (item) { return item.weight > 0; })
                    .sort(function (a, b) { return a.dateISO < b.dateISO ? -1 : 1; });
            }

        function esc(value) {
            return String(value == null ? "" : value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function pad2(n) { return String(n).padStart(2, "0"); }

        function isoDate(date) {
            return date.getFullYear() + "-" + pad2(date.getMonth() + 1) + "-" + pad2(date.getDate());
        }

        function parseNum(value) {
            if (value === null || value === undefined) return NaN;
            const cleaned = String(value).replace(",", ".").replace(/[^\d.\-]/g, "");
            const n = parseFloat(cleaned);
            return isFinite(n) ? n : NaN;
        }

        function round2(n) { return Math.round(n * 100) / 100; }

        function displayNum(value) {
            const n = typeof value === "number" ? value : parseNum(value);
            if (!isFinite(n)) return String(value == null ? "" : value);
            return String(round2(n)).replace(".", ",");
        }

        function inputNum(n) {
            return String(round2(n));
        }

        function plural(n, one, few, many) {
            const a = Math.abs(n) % 100;
            const b = a % 10;
            if (a > 10 && a < 20) return many;
            if (b > 1 && b < 5) return few;
            if (b === 1) return one;
            return many;
        }

        function estimate1RM(weight, reps) {
            const w = parseNum(weight);
            const r = parseNum(reps);
            if (!isFinite(w) || w <= 0 || !isFinite(r) || r <= 0) return 0;
            if (r === 1) return w;
            return w * (1 + Math.min(r, 30) / 30);
        }

        function canonicalName(raw) {
            let n = String(raw == null ? "" : raw).replace(/^\s*\d+\.\s*/, "").trim();
            const key = n.toLowerCase();
            const map = {
                "жим штанга": "Жим штанги",
                "жим штанга 45": "Жим 45",
                "жим гантели 45": "Жим 45",
                "тяга верх блины": "Тяга верхнего блока с блинами",
                "тяга низ блины": "Тяга нижнего с блинами",
                "тяга верх трен": "Тяга верхнего трен",
                "тяга низ трен": "Тяга нижнего трен"

            return map[key] || n;
        }

        function displayExerciseName(raw) {
            return String(raw == null ? "" : raw).replace(/^\s*\d+\.\s*/, "").trim();
        }

        const NAME_GROUP = {};
