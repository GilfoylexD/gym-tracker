        function groupOf(name) {
            const canonical = canonicalName(name);
            const custom = (settings.customExercises || []).find(function (item) {
                return canonicalName(item.name) === canonical;
            });
            if (custom) return GROUP_COLORS[custom.group] ? custom.group : "ДРУГОЕ";
            return NAME_GROUP[canonical] || null;
        }

        function getExerciseGroups() {
            const groups = {};
            Object.keys(EXERCISE_GROUPS).forEach(function (group) {
                groups[group] = EXERCISE_GROUPS[group].slice();
            });
            (settings.customExercises || []).forEach(function (item) {
                const group = GROUP_COLORS[item.group] ? item.group : "ДРУГОЕ";
                if (!groups[group]) groups[group] = [];
                const exists = groups[group].some(function (name) {
                    return canonicalName(name) === canonicalName(item.name);
                });
                if (!exists) groups[group].push(item.name);
            });
            return groups;
        }

        function groupColor(name) {
            return GROUP_COLORS[groupOf(name)] || "#6b7280";
        }

        function dominantGroup(exercises) {
            const counts = {};
            (exercises || []).forEach(function (ex) {
                const g = groupOf(ex.name);
                if (g) counts[g] = (counts[g] || 0) + 1;
            });
            let best = null;
            let bestCount = 0;
            Object.keys(counts).forEach(function (g) {
                if (counts[g] > bestCount) { best = g; bestCount = counts[g]; }
            });
            return best;
        }

        function workoutTonnage(workout) {
            let total = 0;
            (workout.exercises || []).forEach(function (ex) {
                (ex.sets || []).forEach(function (set) {
                    const w = parseNum(set.weight);
                    const r = parseNum(set.reps);
                    if (isFinite(w) && isFinite(r) && w > 0 && r > 0) total += w * r;
                });
            });
            return total;
        }

        function formatTonnage(kg) {
            if (!kg) return "0 кг";
            if (kg >= 1000) {
                const tons = kg / 1000;
                return (tons >= 100 ? tons.toFixed(0) : tons.toFixed(1)).replace(".", ",") + " т";
            }
            return Math.round(kg) + " кг";
        }

        function isoFromLegacyDate(value) {
            const s = String(value || "");
            let m = /(\d{1,2})\.(\d{1,2})\.(\d{4})/.exec(s);
            if (m) return m[3] + "-" + pad2(m[2]) + "-" + pad2(m[1]);
            m = /(\d{1,2})\.(\d{1,2})/.exec(s);
            if (m) return new Date().getFullYear() + "-" + pad2(m[2]) + "-" + pad2(m[1]);
            return "";
        }

        function dateFromWorkout(workout) {
            if (!workout) return null;
            if (workout.dateISO && /^\d{4}-\d{2}-\d{2}$/.test(workout.dateISO)) {
                const parts = workout.dateISO.split("-").map(Number);
                const d = new Date(parts[0], parts[1] - 1, parts[2], 12, 0, 0, 0);
                if (!isNaN(d.getTime())) return d;
            }
            const iso = isoFromLegacyDate(workout.date);
            if (iso) {
                const parts = iso.split("-").map(Number);
                return new Date(parts[0], parts[1] - 1, parts[2], 12, 0, 0, 0);
            }
            return null;
        }

        function formatFullDate(date) {
            const days = ["Воскресенье", "Понедельник", "Вторник", "Среда", "Четверг", "Пятница", "Суббота"];
            return days[date.getDay()] + ", " + pad2(date.getDate()) + "." + pad2(date.getMonth() + 1) + "." + date.getFullYear();
        }

        function formatShortDate(date) {
            return pad2(date.getDate()) + "." + pad2(date.getMonth() + 1);
        }

        function todayISO() { return isoDate(new Date()); }

        function currentScreenId() {
            const screen = document.querySelector(".screen:not(.hidden)");
            return screen ? screen.id : "";
        }

        /* ============================================================
           Telegram helpers
           ============================================================ */

        function haptic(kind) {
            try {
                if (tg && tg.HapticFeedback) {
                    if (kind === "success") tg.HapticFeedback.notificationOccurred("success");
                    else if (kind === "error") tg.HapticFeedback.notificationOccurred("error");
                    else if (kind === "warning") tg.HapticFeedback.notificationOccurred("warning");
                    else if (kind === "select") tg.HapticFeedback.selectionChanged();
                    else tg.HapticFeedback.impactOccurred(kind || "light");
                    return;
                }
                if (navigator.vibrate) {
                    if (kind === "error") navigator.vibrate([120, 60, 120, 60, 120, 60, 120]);
                    else if (kind === "success") navigator.vibrate(35);
                    else navigator.vibrate(15);
                }
            } catch (e) {}
        }

        /* ============================================================
           Тосты, undo, модалки
           ============================================================ */

        function ensureAudio() {
            if (!settings.sound) return;
            try {
                if (!audioCtx) {
                    const AudioCtor = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtor) audioCtx = new AudioCtor();
                }
                if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
            } catch (e) {}
        }

        function playRestSound() {
            if (!settings.sound) return;
            ensureAudio();
            if (!audioCtx) return;
            try {
                const start = audioCtx.currentTime + 0.02;
                [660, 880].forEach(function (frequency, index) {
                    const oscillator = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    const at = start + index * 0.22;
                    oscillator.type = "sine";
                    oscillator.frequency.value = frequency;
                    gain.gain.setValueAtTime(0.0001, at);
                    gain.gain.exponentialRampToValueAtTime(0.18, at + 0.015);
                    gain.gain.exponentialRampToValueAtTime(0.0001, at + 0.16);
                    oscillator.connect(gain);
                    gain.connect(audioCtx.destination);
                    oscillator.start(at);
                    oscillator.stop(at + 0.18);
                });
            } catch (e) {}
        }

        async function requestWakeLock() {
            if (!settings.keepAwake || !("wakeLock" in navigator) || document.hidden) return;
            try {
                if (wakeLock) return;
                wakeLock = await navigator.wakeLock.request("screen");
                wakeLock.addEventListener("release", function () { wakeLock = null; });
            } catch (e) {
                wakeLock = null;
            }
        }

        function releaseWakeLock() {
            if (!wakeLock) return;
            try { wakeLock.release(); } catch (e) {}
            wakeLock = null;
        }

        function showToast(text, type, duration) {
            const root = document.getElementById("toast-root");
            if (!root) return;
            const el = document.createElement("div");
            el.className = "toast " + (type || "");
            el.textContent = text;
            root.appendChild(el);
            requestAnimationFrame(function () { el.classList.add("show"); });
            setTimeout(function () {
                el.classList.remove("show");
                setTimeout(function () { el.remove(); }, 250);
            }, duration || 2400);
        }

        function hideUndoBar() {
            if (undoTimer) { clearTimeout(undoTimer); undoTimer = null; }
            const bar = document.getElementById("undo-bar");
            if (bar) bar.classList.remove("show");
        }

        function showUndoBar(text, onUndo, duration) {
            const bar = document.getElementById("undo-bar");
            if (!bar) return;
            if (undoTimer) clearTimeout(undoTimer);
            const ms = duration || 6000;
            bar.innerHTML =
                '<div class="flex items-center justify-between gap-3">' +
                    '<span class="text-[12px] font-semibold text-gray-200 leading-tight">' + esc(text) + '</span>' +
                    '<button type="button" class="text-blue-400 font-black text-xs px-3 py-1.5 rounded-lg bg-blue-500/10 flex-shrink-0">Отменить</button>' +
                '</div>' +
                '<div class="undo-progress"><div></div></div>';
            bar.classList.add("show");
            const btn = bar.querySelector("button");
            if (btn) {
                btn.onclick = function () {
                    hideUndoBar();
                    onUndo();
                };
            }
            const progress = bar.querySelector(".undo-progress > div");
            if (progress) {
                requestAnimationFrame(function () {
                    progress.style.transition = "width " + ms + "ms linear";
                    progress.style.width = "0%";
                });
            }
            undoTimer = setTimeout(hideUndoBar, ms);
        }

        function updateBackButton() {
            if (!tg || !tg.BackButton) return;
            try {
                if (modalStack.length > 0) tg.BackButton.show();
                else if (currentScreenId() === "screen-history") tg.BackButton.hide();
                else tg.BackButton.show();
            } catch (e) {}
        }

        function showModal(options) {
            const opts = options || {};
            const actions = opts.actions || [{ label: "Понятно", value: true, primary: true }];
            return new Promise(function (resolve) {
                const root = document.getElementById("modal-root");
                if (!root) { resolve(null); return; }

                const backdrop = document.createElement("div");
                backdrop.className = "modal-backdrop";
                const sheet = document.createElement("div");
                sheet.className = "modal-sheet";
                sheet.innerHTML =
                    '<div class="modal-grab"></div>' +
                    (opts.title ? '<h3 class="modal-title">' + esc(opts.title) + '</h3>' : '') +
                    (opts.message ? '<p class="modal-message">' + esc(opts.message) + '</p>' : '') +
                    (opts.body || '') +
                    '<div class="modal-actions' + (actions.length === 2 ? ' two' : '') + '"></div>';

                const actionsWrap = sheet.querySelector(".modal-actions");
                let closed = false;

                function close(value) {
                    if (closed) return;
                    closed = true;
                    backdrop.classList.remove("show");
                    setTimeout(function () { backdrop.remove(); }, 190);
                    const idx = modalStack.indexOf(close);
                    if (idx >= 0) modalStack.splice(idx, 1);
                    updateBackButton();
                    document.removeEventListener("keydown", onKey);
                    resolve(value);
                }

                function onKey(e) {
                    if (e.key === "Escape" && opts.dismissible !== false) close(null);
                }

                actions.forEach(function (action) {
                    const btn = document.createElement("button");
                    btn.type = "button";
                    btn.className = "modal-btn " + (action.danger ? "danger" : action.primary ? "primary" : "ghost");
                    btn.textContent = action.label;
                    btn.addEventListener("click", async function (e) {
                        e.stopPropagation();
                        let value = action.value;
                        if (action.onClick) {
                            try {
                                value = await action.onClick(sheet);
                            } catch (err) {
                                value = null;
                            }
                            if (value === false) return;
                        }
                        close(value);
                    });
                    actionsWrap.appendChild(btn);
                });

                backdrop.addEventListener("click", function (e) {
                    if (e.target === backdrop && opts.dismissible !== false) close(null);
                });

                document.addEventListener("keydown", onKey);
                backdrop.appendChild(sheet);
                root.appendChild(backdrop);
                modalStack.push(close);
                updateBackButton();
                requestAnimationFrame(function () { backdrop.classList.add("show"); });
                if (opts.onMount) {
                    try { opts.onMount(sheet, close); } catch (e) {}
                }
            });
        }

        function uiAlert(message, title) {
            return showModal({
                title: title || "Внимание",
                message: message,
                actions: [{ label: "Понятно", value: true, primary: true }]
            });
        }

        async function uiConfirm(message, options) {
            const opts = options || {};
            const result = await showModal({
                title: opts.title || "Подтверждение",
                message: message,
                actions: [
                    { label: "Отмена", value: false },
                    { label: opts.okLabel || "Да", value: true, primary: !opts.danger, danger: !!opts.danger }
                ]
            });
            return result === true;
        }

        function showMoodNoteModal(options) {
            const opts = options || {};
            let selected = opts.mood || "";
            const body =
                (opts.summaryHtml || "") +
                '<p class="modal-label">САМОЧУВСТВИЕ</p>' +
                '<div class="mood-row">' +
                    MOODS.map(function (m) {
                        return '<button type="button" class="mood-btn" data-mood="' + esc(m.emoji) + '" title="' + esc(m.label) + '">' + m.emoji + '</button>';
                    }).join("") +
                '</div>' +
                '<p class="modal-label">ЗАМЕТКА</p>' +
                '<textarea class="note-input" maxlength="500" rows="3" placeholder="Что получилось, что болит, что улучшить...">' + esc(opts.note || "") + '</textarea>';

            return showModal({
                title: opts.title || "Заметка",
                message: opts.message || "",
                body: body,
                actions: [
                    { label: "Отмена", value: null },
                    {
                        label: opts.saveLabel || "Сохранить",
                        primary: true,
                        onClick: function (sheet) {
                            return {
                                mood: selected,
                                note: sheet.querySelector(".note-input").value.trim()
                            };
                        }
                    }
                ],
                onMount: function (sheet) {
                    const buttons = sheet.querySelectorAll(".mood-btn");
                    buttons.forEach(function (btn) {
                        if (btn.dataset.mood === selected) btn.classList.add("active");
                        btn.addEventListener("click", function () {
                            selected = btn.dataset.mood;
                            buttons.forEach(function (b) { b.classList.toggle("active", b === btn); });
                            haptic("select");
                        });
                    });
                }
            });
        }

        /* ============================================================
           Данные
           ============================================================ */

        function sanitizeWorkout(raw) {
            if (!raw || typeof raw !== "object" || !Array.isArray(raw.exercises)) return null;
            const exercises = raw.exercises
                .filter(function (ex) { return ex && typeof ex === "object"; })
                .map(function (ex) {
                    const sets = Array.isArray(ex.sets) ? ex.sets
                        .filter(function (s) { return s && typeof s === "object"; })
                        .map(function (s) {
                            return {
                                weight: (s.weight === null || s.weight === undefined) ? "" : String(s.weight),
                                reps: (s.reps === null || s.reps === undefined) ? "" : String(s.reps),
                                pr: !!s.pr
                            };
                        })
                        .filter(function (s) { return s.weight !== "" || s.reps !== ""; }) : [];
                    return { name: String(ex.name || "Упражнение"), sets: sets };
                })
                .filter(function (ex) { return ex.sets.length > 0; });

            if (!exercises.length) return null;

            const dateISO = (raw.dateISO && /^\d{4}-\d{2}-\d{2}$/.test(raw.dateISO))
                ? raw.dateISO
                : isoFromLegacyDate(raw.date);
            const d = dateISO ? new Date(dateISO + "T12:00:00") : null;
            const validDate = d && !isNaN(d.getTime()) ? d : null;

            return {
                id: Number(raw.id) || (Date.now() + Math.floor(Math.random() * 1000000)),
                date: String(raw.date || (validDate ? formatFullDate(validDate) : "Тренировка")),
                dateISO: dateISO || "",
                shortDate: String(raw.shortDate || (validDate ? formatShortDate(validDate) : "")),
                duration: String(raw.duration || ""),
                durationSeconds: Number(raw.durationSeconds) || 0,
                mood: raw.mood ? String(raw.mood).slice(0, 12) : "",
                note: raw.note ? String(raw.note) : "",
                exercises: exercises
            };
        }

        function sortHistory() {
            historyData.sort(function (a, b) {
                const da = dateFromWorkout(a);
                const db = dateFromWorkout(b);
                return (db ? db.getTime() : 0) - (da ? da.getTime() : 0);
            });
        }

        function persistHistory() {
            try {
                localStorage.setItem(HISTORY_KEY, JSON.stringify(historyData));
                return true;
            } catch (e) {
                return false;
            }
        }

        function saveSettings() {
            try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); } catch (e) {}
        }

        function restoreLegacyHistory() {
            const currentVersion = Number(settings.legacyRestoreVersion) || 0;
            if (currentVersion >= LEGACY_RESTORE_VERSION) return false;

            if (historyData.length) createSnapshot("Перед восстановлением истории из заметок");

            const legacyIds = new Set();
            for (let i = 1; i <= 9; i++) legacyIds.add(i);
            for (let i = 1001; i <= 1009; i++) legacyIds.add(i);

            historyData = historyData.filter(function (workout) {
                return !legacyIds.has(Number(workout.id));
            });

            LEGACY_WORKOUTS.forEach(function (workout) {
                const restored = sanitizeWorkout(workout);
                if (restored) historyData.push(restored);
            });

            settings.legacyRestoreVersion = LEGACY_RESTORE_VERSION;
            saveSettings();
            persistHistory();
            return true;
        }

        function loadData() {
            let loaded = false;

            try {
                const raw = localStorage.getItem(HISTORY_KEY);
                if (raw !== null) {
                    const parsed = JSON.parse(raw);
                    if (Array.isArray(parsed)) {
                        historyData = parsed.map(sanitizeWorkout).filter(Boolean);
                        loaded = true;
                    }
                }
            } catch (e) {}

            if (!loaded) {
                historyData = [];
            }

            try {
                const rawSettings = localStorage.getItem(SETTINGS_KEY);
                if (rawSettings) {
                    settings = normalizeSettings(JSON.parse(rawSettings));
                }
            } catch (e) {}

            const restored = restoreLegacyHistory();
            sortHistory();

            if (restored || !loaded) persistHistory();
        }

        function buildBackup() {
            return {
                app: "gym-tracker",
                version: 3,
                exportedAt: new Date().toISOString(),
                history: historyData,
                settings: settings
            };
        }

        /* ============================================================
           Autosave активной тренировки
           ============================================================ */

        function sanitizeSessionData(raw) {
            if (!raw || typeof raw !== "object" || !Array.isArray(raw.exercises)) return null;

            const exercises = raw.exercises
                .filter(function (ex) { return ex && typeof ex === "object"; })
                .map(function (ex) {
                    const sets = Array.isArray(ex.sets) ? ex.sets
                        .filter(function (set) { return set && typeof set === "object"; })
                        .map(function (set) {
                            return {
                                weight: (set.weight === null || set.weight === undefined) ? "" : String(set.weight),
                                reps: (set.reps === null || set.reps === undefined) ? "" : String(set.reps),
                                pr: !!set.pr,
                                prType: String(set.prType || "")
                            };
                        })
                        .filter(function (set) { return set.weight !== "" || set.reps !== ""; }) : [];
                    return { name: String(ex.name || ""), sets: sets };
                })
                .filter(function (ex) { return ex.name && ex.sets.length > 0; });

            const plan = Array.isArray(raw.plan) ? raw.plan
                .filter(function (item) { return item && typeof item === "object"; })
                .map(function (item) {
                    return {
                        name: canonicalName(String(item.name || "")),
                        targetSets: Math.max(1, Math.min(20, Number(item.targetSets) || 4))
                    };
                })
                .filter(function (item) { return item.name; }) : [];

            if (!exercises.length && !plan.length) return null;

            return {
                startedAt: Number(raw.startedAt) || Date.now(),
                elapsedSeconds: Math.max(0, Number(raw.elapsedSeconds) || 0),
                savedAt: Number(raw.savedAt) || Date.now(),
                currentExercise: String(raw.currentExercise || ""),
                exercises: exercises,
                plan: plan
            };
        }

        function persistActiveSession() {
            const hasSets = currentSessionExercises.some(function (ex) { return ex.sets.length > 0; });
            if (!hasSets && !currentPlan.length) {
                try { localStorage.removeItem(SESSION_KEY); } catch (e) {}
                return;
            }

            const startedAt = workoutStartTime || (Date.now() - elapsedSeconds * 1000);
            const elapsed = Math.max(elapsedSeconds, Math.floor((Date.now() - startedAt) / 1000));
            const data = {
                startedAt: startedAt,
                elapsedSeconds: elapsed,
                savedAt: Date.now(),
                currentExercise: currentExercise,
                exercises: currentSessionExercises,
                plan: currentPlan
            };
            try { localStorage.setItem(SESSION_KEY, JSON.stringify(data)); } catch (e) {}
        }

        function clearStoredSession() {
            pendingSession = null;
            try { localStorage.removeItem(SESSION_KEY); } catch (e) {}
            renderResumeBanner();
        }

        function loadPendingSession() {
            let raw = null;
            try {
                const text = localStorage.getItem(SESSION_KEY);
                if (text) raw = JSON.parse(text);
            } catch (e) {}
            pendingSession = sanitizeSessionData(raw);
            if (!pendingSession) {
                try { localStorage.removeItem(SESSION_KEY); } catch (e) {}
            }
            renderResumeBanner();
        }

        function renderResumeBanner() {
            const banner = document.getElementById("resume-banner");
            if (!banner) return;

            if (!pendingSession) {
                banner.classList.add("hidden");
                banner.innerHTML = "";
                return;
            }

            const p = pendingSession;
            const sets = p.exercises.reduce(function (sum, ex) { return sum + ex.sets.length; }, 0);
            const started = new Date(p.startedAt || p.savedAt || Date.now());
            const dateText = started.toLocaleDateString("ru-RU", { day: "2-digit", month: "2-digit" }) +
                " · " + started.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });

            banner.innerHTML =
                '<div class="flex items-start justify-between gap-2">' +
                    '<div class="min-w-0">' +
                        '<div class="text-[10px] font-black tracking-widest text-blue-300">НЕЗАВЕРШЁННАЯ ТРЕНИРОВКА</div>' +
                        '<div class="text-[11px] text-gray-300 font-semibold mt-1">' + dateText + ' · ' +
                            p.exercises.length + ' упр · ' + sets + ' ' + plural(sets, "подход", "подхода", "подходов") + '</div>' +
                    '</div>' +
                    '<button type="button" data-resume-close class="w-7 h-7 rounded-lg bg-gray-800/60 text-gray-400 flex items-center justify-center flex-shrink-0">✕</button>' +
                '</div>' +
                '<div class="flex gap-2 mt-2.5">' +
                    '<button type="button" data-resume-start class="flex-1 btn-primary text-white font-black py-2 rounded-lg text-[11px]">ПРОДОЛЖИТЬ</button>' +
                    '<button type="button" data-resume-finish class="flex-1 bg-gray-700/70 text-gray-200 font-bold py-2 rounded-lg text-[11px]">ЗАВЕРШИТЬ</button>' +
                '</div>';
            banner.classList.remove("hidden");

            const closeBtn = banner.querySelector("[data-resume-close]");
            if (closeBtn) {
                closeBtn.addEventListener("click", function () {
                    uiConfirm("Удалить незавершённую тренировку? Записанные подходы пропадут.", { title: "Удалить сессию?", okLabel: "Удалить", danger: true })
                        .then(function (ok) {
                            if (ok) {
                                clearStoredSession();
                                showToast("Незавершённая тренировка удалена");
                            }
                        });
                });
            }
            const startBtn = banner.querySelector("[data-resume-start]");
            if (startBtn) startBtn.addEventListener("click", resumePendingSession);
            const finishBtn = banner.querySelector("[data-resume-finish]");
            if (finishBtn) finishBtn.addEventListener("click", finishPendingSession);
        }

        function resumePendingSession() {
            if (!pendingSession) return;
            const p = pendingSession;
            const gap = Math.min(15 * 60, Math.max(0, Math.floor((Date.now() - (p.savedAt || Date.now())) / 1000)));
            elapsedSeconds = Math.max(0, Number(p.elapsedSeconds) || 0) + gap;
            workoutStartTime = Date.now() - elapsedSeconds * 1000;

            currentSessionExercises = p.exercises;
            currentPlan = p.plan || [];
            currentExercise = p.currentExercise || "";
            if (!currentExercise && currentPlan.length) currentExercise = currentPlan[0].name;
            pendingSession = null;
            try { localStorage.removeItem(SESSION_KEY); } catch (e) {}
            renderResumeBanner();

            startTimer();
            ensureAudio();
            requestWakeLock();

            if (currentExercise) {
                goToExercise();
            } else {
                showScreen("screen-select-exercise");
            }
            showToast("Тренировка восстановлена", "success");
            persistActiveSession();
        }

        function finishPendingSession() {
            resumePendingSession();
            setTimeout(function () {
                if (currentSessionExercises.length) finishWorkout();
            }, 350);
        }

        /* ============================================================
           Локальные копии (снапшоты)
           ============================================================ */

        function readSnapshots() {
            try {
                const raw = localStorage.getItem(SNAPSHOTS_KEY);
                const parsed = raw ? JSON.parse(raw) : [];
                return Array.isArray(parsed) ? parsed.filter(function (s) { return s && Array.isArray(s.history); }) : [];
            } catch (e) {
                return [];
            }
        }

        function writeSnapshots(list) {
            let items = list.slice();
            while (items.length) {
                try {
                    localStorage.setItem(SNAPSHOTS_KEY, JSON.stringify(items));
                    return true;
                } catch (e) {
                    items.pop();
                }
            }
            try { localStorage.removeItem(SNAPSHOTS_KEY); } catch (e) {}
            return false;
        }

        function createSnapshot(reason) {
            if (!historyData.length && !(settings.templates && settings.templates.length)) return null;
            const list = readSnapshots();
            const snapshot = {
                id: Date.now() + Math.floor(Math.random() * 1000),
                at: Date.now(),
                reason: String(reason || "Копия"),
                history: JSON.parse(JSON.stringify(historyData)),
                settings: JSON.parse(JSON.stringify(settings))
            };
            list.unshift(snapshot);
            while (list.length > 4) list.pop();
            writeSnapshots(list);
            return snapshot;
        }

        function deleteSnapshotById(id) {
            writeSnapshots(readSnapshots().filter(function (s) { return s.id !== id; }));
        }

        function restoreSnapshot(id) {
            const snapshots = readSnapshots();
            const snap = snapshots.find(function (s) { return s.id === id; });
            if (!snap) return;

            createSnapshot("Перед восстановлением копии");
            historyData = (snap.history || []).map(sanitizeWorkout).filter(Boolean);
            settings = normalizeSettings(snap.settings);
            settings.legacyRestoreVersion = Math.max(Number(settings.legacyRestoreVersion) || 0, LEGACY_RESTORE_VERSION);
            saveSettings();
            persistHistory();
            expandedIds.clear();
            clearStoredSession();
            sortHistory();
            renderAll();
            showScreen("screen-history");
            renderBackupReminder();
            showToast("Локальная копия восстановлена", "success", 2800);
        }

        async function openSnapshotsSheet() {
            const snapshots = readSnapshots();
            if (!snapshots.length) {

        function renderBackupReminder() {
            const banner = document.getElementById("backup-banner");
            if (!banner) return;
            const now = Date.now();
            const days = settings.lastBackup ? Math.floor((now - settings.lastBackup) / 86400000) : null;

                (!settings.lastBackup || days >= 14) &&
                (!settings.backupReminderSnooze || settings.backupReminderSnooze < now);

        /* ============================================================
           Статистика и тепловая карта
           ============================================================ */

        function computeStats() {
            const now = new Date();

            function weekStart(offset) {
                const date = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 12);
                date.setDate(date.getDate() - ((date.getDay() + 6) % 7) + offset * 7);
                return date;
            }

            function workoutsInWeek(start) {
                const end = new Date(start.getFullYear(), start.getMonth(), start.getDate() + 7, 12);
                return historyData.filter(function (workout) {
                    const date = dateFromWorkout(workout);
                    return date && date >= start && date < end;
                }).length;
            }

            const currentWeekStart = weekStart(0);
            let week = workoutsInWeek(currentWeekStart);
            let tonnage = 0;
            historyData.forEach(function (workout) { tonnage += workoutTonnage(workout); });

            let cursor = weekStart(0);
            if (workoutsInWeek(cursor) < 2) cursor = weekStart(-1);
            let streak = 0;
            while (workoutsInWeek(cursor) >= 2) {
                streak++;
                cursor.setDate(cursor.getDate() - 7);
            }

            return { week: week, tonnage: tonnage, streak: streak };
        }

        function renderStats() {
            const container = document.getElementById("stats-row");
            if (!container) return;
            const s = computeStats();
            const streakWord = plural(s.streak, "неделя", "недели", "недель");
            const weekWord = plural(s.week, "тренировка", "тренировки", "тренировок");
            container.innerHTML =
                '<div class="stat-card">' +
                    '<div class="stat-value">' + s.week + '</div>' +
                    '<div class="stat-label">' + weekWord + '<br>за неделю</div>' +
                '</div>' +
                '<div class="stat-card">' +
                    '<div class="stat-value">' + esc(formatTonnage(s.tonnage)) + '</div>' +
                    '<div class="stat-label">тоннаж<br>всего</div>' +
                '</div>' +
                '<div class="stat-card" title="Недели подряд, где было 2+ тренировки">' +
                    '<div class="stat-value">' + s.streak + '</div>' +
                    '<div class="stat-label">' + streakWord + '<br>подряд</div>' +
                '</div>';
        }

        function monthTitle(date) {
            const names = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];
            return names[date.getMonth()] + " " + date.getFullYear();
        }

        function renderHeatmap() {
            const grid = document.getElementById("heat-grid");
            const title = document.getElementById("heat-title");
            if (!grid || !title) return;

            const year = heatMonth.getFullYear();
            const month = heatMonth.getMonth();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const first = new Date(year, month, 1, 12);
            const offset = (first.getDay() + 6) % 7;
            const today = new Date();
            const todayIso = isoDate(today);

            const tonnageByDay = {};
            let maxTonnage = 0;
            historyData.forEach(function (w) {
                const d = dateFromWorkout(w);
                if (!d || d.getFullYear() !== year || d.getMonth() !== month) return;
                const key = isoDate(d);
                tonnageByDay[key] = (tonnageByDay[key] || 0) + workoutTonnage(w);
                maxTonnage = Math.max(maxTonnage, tonnageByDay[key]);
            });

            title.textContent = monthTitle(heatMonth);

            const colors = [
                "rgba(37,99,235,.28)",
                "rgba(37,99,235,.5)",
                "rgba(37,99,235,.75)",
                "#3b82f6"
            ];

            let html = "";
            for (let i = 0; i < offset; i++) html += '<span></span>';
            for (let d = 1; d <= daysInMonth; d++) {
                const date = new Date(year, month, d, 12);
                const iso = isoDate(date);
                const t = tonnageByDay[iso] || 0;
                let level = 0;
                if (t > 0 && maxTonnage > 0) {
                    if (t >= maxTonnage * 0.75) level = 4;
                    else if (t >= maxTonnage * 0.5) level = 3;
                    else if (t >= maxTonnage * 0.25) level = 2;
                    else level = 1;
                }
                const isToday = iso === todayIso;
                const isFuture = date > today;
                const style = level
                    ? "background:" + colors[level - 1] + ";"
                    : "background:rgba(55,65,81,.26);" + (isFuture ? "opacity:.45;" : "");
                const classes = "heat-cell" + (level ? " has" : "") + (isToday ? " today" : "") + (level ? " clickable" : "");
                const titleText = d + " " + monthTitle(new Date(year, month, 1)).split(" ")[0] + " — " + (t ? formatTonnage(t) : "нет тренировки");
                html += '<div class="' + classes + '" data-iso="' + iso + '" style="' + style + '" title="' + esc(titleText) + '">' + d + '</div>';
            }

            grid.innerHTML = html;
            grid.querySelectorAll(".heat-cell.has").forEach(function (cell) {
                cell.addEventListener("click", function () {
                    openDay(cell.dataset.iso);
                });
            });
        }

        function openDay(iso) {
            const workouts = historyData.filter(function (workout) {
                const date = dateFromWorkout(workout);
                return date && isoDate(date) === iso;
            });
            if (!workouts.length) {
                showToast("В этот день тренировок не было");
                return;
            }
            if (workouts.length === 1) {
                focusWorkout(workouts[0].id);
                return;
            }
            showModal({
                title: "Тренировки дня",
                body: workouts.map(function (workout) {
                    return '<button type="button" class="template-row" data-day-id="' + workout.id + '">' +
                        '<div class="min-w-0 flex-1"><div class="template-name">' + esc(workout.date) + '</div>' +
                        '<div class="template-meta">' + workout.exercises.length + ' упр · ' + esc(workout.duration || "") + '</div></div>' +
                    '</button>';
                }).join(""),
                actions: [{ label: "Закрыть", value: null }],
                onMount: function (sheet, close) {
                    sheet.querySelectorAll("[data-day-id]").forEach(function (btn) {
                        btn.addEventListener("click", function () {
                            const id = Number(btn.dataset.dayId);
                            close();
                            setTimeout(function () { focusWorkout(id); }, 180);
                        });
                    });
                }
            });
        }

        function focusWorkout(id) {
            showScreen("screen-history");
            setTimeout(function () {
                const wrap = document.querySelector('.swipe-wrap[data-id="' + id + '"]');
                if (!wrap) return;
                const card = wrap.querySelector(".hist-card");
                const exWrap = wrap.querySelector(".ex-wrap");
                if (exWrap && exWrap.dataset.open !== "1") {
                    const head = wrap.querySelector(".hist-head");

                }
                wrap.scrollIntoView({ behavior: "smooth", block: "center" });
                if (card) {
                    card.classList.add("flash");
                    setTimeout(function () { card.classList.remove("flash"); }, 1600);
                }
                haptic("light");
            }, 30);
        }

        function changeHeatMonth(delta) {
            const now = new Date();
            const next = new Date(heatMonth.getFullYear(), heatMonth.getMonth() + delta, 1);
            const currentMonth = new Date(now.getFullYear(), now.getMonth(), 1);
            if (next > currentMonth) return;
            heatMonth = next;
            renderHeatmap();
            haptic("light");
        }

        /* ============================================================
           Прошлые результаты и рекорды
           ============================================================ */

        function getLastSetsFor(exerciseName) {
            const target = canonicalName(exerciseName);
            for (let i = 0; i < historyData.length; i++) {
                const workout = historyData[i];
                const found = workout.exercises.find(function (ex) {
                    return canonicalName(ex.name) === target && ex.sets && ex.sets.length > 0;
                });
                if (found) return found.sets;
            }
            return [];
        }

        function getBests(exerciseName, includeSession) {
            const target = canonicalName(exerciseName);
            let bestWeight = 0;
            let bestOneRM = 0;
            let bestSet = null;

            function scan(sets) {
                (sets || []).forEach(function (set) {
                    const w = parseNum(set.weight);
                    const r = parseNum(set.reps);
                    if (!isFinite(w) || w <= 0) return;
                    if (w > bestWeight) {
                        bestWeight = w;
                        bestSet = { weight: w, reps: r };
                    }
                    if (isFinite(r) && r > 0) {
                        const est = estimate1RM(w, r);
                        if (est > bestOneRM) bestOneRM = est;
                    }
                });
            }

            historyData.forEach(function (workout) {
                const found = workout.exercises.find(function (ex) {
                    return canonicalName(ex.name) === target;
                });
                if (found) scan(found.sets);
            });

            if (includeSession) {
                currentSessionExercises.forEach(function (ex) {
                    if (canonicalName(ex.name) === target) scan(ex.sets);
                });
            }

            return { weight: bestWeight, oneRM: bestOneRM, set: bestSet };
        }

        function fillInputs(weight, reps) {
            document.getElementById("input-weight").value = weight;
            document.getElementById("input-reps").value = reps;
            haptic("light");
        }

        function getProgression(exerciseName) {
            const sessionEx = currentSessionExercises.find(function (ex) {
                return canonicalName(ex.name) === canonicalName(exerciseName);
            });
            const sets = (sessionEx && sessionEx.sets.length) ? sessionEx.sets : getLastSetsFor(exerciseName);
            if (!sets.length) return null;
            let maxWeight = 0;
            let allTen = true;
            sets.forEach(function (set) {
                const weight = parseNum(set.weight);
                const reps = parseNum(set.reps);
                if (isFinite(weight) && weight > maxWeight) maxWeight = weight;
                if (!isFinite(reps) || reps < 10) allTen = false;
            });
            return {
                sets: sets,
                allTen: allTen,
                maxWeight: maxWeight,
                suggested: maxWeight > 0 ? round2(maxWeight + 2.5) : 0
            };
        }

        function updateLastStatsCard(exerciseName) {
            const container = document.getElementById("last-stats");
            const badge = document.getElementById("record-badge");
            if (!container || !badge) return;

            const sets = getLastSetsFor(exerciseName);
            const best = getBests(exerciseName, false);
            const progression = getProgression(exerciseName);
            const hint = document.getElementById("progression-hint");

            if (!sets.length) {
                container.innerHTML = '<span class="text-[11px] text-gray-500 font-semibold">Первый раз — задай ориентир 💪</span>';
            } else {
                let html = "";
                sets.slice(0, 8).forEach(function (set, index) {
                    html += '<button type="button" class="set-chip" data-w="' + esc(set.weight) + '" data-r="' + esc(set.reps) + '">' +
                        displayNum(set.weight) + ' × ' + displayNum(set.reps) +
                        '</button>';
                });
                if (sets.length > 8) {
                    html += '<span class="text-[10px] text-gray-500 font-bold">+' + (sets.length - 8) + '</span>';
                }
                container.innerHTML = html;
                container.querySelectorAll(".set-chip").forEach(function (chip) {
                    chip.addEventListener("click", function () {
                        fillInputs(chip.dataset.w, chip.dataset.r);
                        setAutofillHint("Подставлено: " + displayNum(chip.dataset.w) + " кг × " + displayNum(chip.dataset.r));
                    });
                });
            }

            if (best.weight > 0) {
                badge.classList.remove("hidden");
                badge.textContent = "🏆 " + displayNum(best.weight) + " кг";
                badge.title = "Лучший вес. Расчётный 1ПМ: " + Math.round(best.oneRM) + " кг";
            } else {
                badge.classList.add("hidden");
                badge.textContent = "";
            }

            if (hint) {
                hint.classList.remove("neutral");
                if (progression && progression.allTen && progression.suggested) {
                    hint.innerHTML = 'Все подходы по 10 → следующий вес <span class="suggest">' +
                        displayNum(progression.suggested) + ' кг</span>';
                } else if (sets.length) {
                    hint.textContent = 'Цель: 10 повторений в каждом подходе';
                    hint.classList.add("neutral");
                } else {
                    hint.textContent = 'Сделай все подходы по 10 — подскажу следующий вес';
                    hint.classList.add("neutral");
                }
            }

            updateExerciseNotePreview();
            updateRestNext();
            updateRestPrefDisplay();
        }

        function updateExerciseNotePreview() {
            const preview = document.getElementById("exercise-note-preview");
            const button = document.getElementById("exercise-note-btn");
            if (!preview || !button) return;
            const note = currentExercise ? (settings.exerciseNotes[canonicalName(currentExercise)] || "") : "";
            if (note) {
                preview.textContent = "📝 " + note;
                preview.classList.remove("hidden");
                button.classList.add("has-note");
            } else {
                preview.textContent = "";
                preview.classList.add("hidden");
                button.classList.remove("has-note");
            }
        }

        function openExerciseNote() {
            if (!currentExercise) return;
            const key = canonicalName(currentExercise);
            const current = settings.exerciseNotes[key] || "";

            showModal({
                title: "Заметка к упражнению",
                message: displayExerciseName(currentExercise),
                body: '<textarea class="note-input exercise-note-input" maxlength="500" rows="4" placeholder="Например: сиденье 3, хват широкий, спинка 4...">' + esc(current) + '</textarea>',
                actions: [
                    {
                        label: "Удалить",
                        danger: true,
                        onClick: function () {
                            delete settings.exerciseNotes[key];
                            saveSettings();
                            updateExerciseNotePreview();
                            showToast("Заметка удалена");
                            return true;
                        }
                    },
                    {
                        label: "Сохранить",
                        primary: true,
                        onClick: function (sheet) {
                            const input = sheet.querySelector(".exercise-note-input");
                            const value = input ? input.value.trim() : "";
                            if (value) settings.exerciseNotes[key] = value;
                            else delete settings.exerciseNotes[key];
                            saveSettings();
                            updateExerciseNotePreview();
                            showToast("Заметка сохранена", "success");
                            return true;
                        }
                    },
                    { label: "Отмена", value: null }
                ]
            });
        }

        function updateRestNext() {
            const nextEl = document.getElementById("rest-next");
            if (!nextEl) return;
            if (!currentExercise) {
                nextEl.textContent = "Следующий подход";
                return;
            }
            const sessionEx = currentSessionExercises.find(function (ex) { return ex.name === currentExercise; });
            const count = sessionEx ? sessionEx.sets.length : 0;
            const lastSets = getLastSetsFor(currentExercise);
            const target = lastSets[count] || lastSets[lastSets.length - 1] ||
                (sessionEx && sessionEx.sets.length ? sessionEx.sets[sessionEx.sets.length - 1] : null);
            const nextNumber = count + 1;
            nextEl.textContent = target
                ? "Подход " + nextNumber + " · " + displayNum(target.weight) + "×" + displayNum(target.reps)
                : "Подход " + nextNumber;
        }

        function setAutofillHint(text) {
            const hint = document.getElementById("autofill-hint");
            if (hint) hint.textContent = text || "";
        }

        /* ============================================================
           Экран выбора упражнения
           ============================================================ */

        function renderExerciseList() {
            const container = document.getElementById("exercise-list-container");
            if (!container) return;
            container.innerHTML = "";

            const groups = getExerciseGroups();
            Object.keys(groups).forEach(function (groupName) {
                const groupHeader = document.createElement("h3");
                groupHeader.className = "group-header";
                groupHeader.style.color = GROUP_COLORS[groupName] || "#93c5fd";
                groupHeader.innerHTML = '<span class="group-dot" style="background:' +
                    (GROUP_COLORS[groupName] || "#3b82f6") + ';color:' + (GROUP_COLORS[groupName] || "#3b82f6") + '"></span>' + esc(groupName);
                container.appendChild(groupHeader);

                const groupContainer = document.createElement("div");
                groupContainer.className = "space-y-2";

                groups[groupName].forEach(function (exercise) {
                    const isCustom = (settings.customExercises || []).some(function (item) {
                        return canonicalName(item.name) === canonicalName(exercise);
                    });

                    wrap.className = "exercise-row-wrap" + (isCustom ? " has-custom" : "");

                    btn.type = "button";
                    btn.className = "exercise-item";

                        '<div class="circle w-5 h-5 rounded-full border-2 border-gray-500 mr-4 pointer-events-none transition-all flex-shrink-0"></div>' +
                        '<span class="pointer-events-none text-sm font-medium">' + esc(exercise) + '</span>';

                        selectExercise(exercise, btn);
                    });
                    wrap.appendChild(btn);

                        const del = document.createElement("button");
                        del.type = "button";
                        del.className = "custom-del";
                        del.textContent = "✕";
                        del.setAttribute("aria-label", "Удалить своё упражнение");
                        del.addEventListener("click", function (e) {
                            e.stopPropagation();
                            uiConfirm("Убрать «" + exercise + "» из списка? История тренировок останется.", {
                                title: "Удалить упражнение?",
                                okLabel: "Удалить",
                                danger: true
                            }).then(function (ok) {
                                if (!ok) return;
                                settings.customExercises = (settings.customExercises || []).filter(function (item) {
                                    return canonicalName(item.name) !== canonicalName(exercise);
                                });
                                saveSettings();
                                renderExerciseList();
                                syncExerciseSelection();
                                showToast("Упражнение убрано из списка");

                        });
                        wrap.appendChild(del);

                    groupContainer.appendChild(wrap);
                });

        function openCustomExerciseModal() {
            const groupOptions = Object.keys(GROUP_COLORS).map(function (group) {
                return '<option value="' + esc(group) + '"' + (group === "ДРУГОЕ" ? " selected" : "") + '>' + esc(group) + '</option>';
            }).join("");

            showModal({
                title: "Своё упражнение",
                message: "Добавится в список и будет учитываться в рекордах и объёме.",
                body: '<label class="input-label" for="custom-name">Название</label>' +
                    '<input id="custom-name" class="w-full rounded-xl p-3 text-white font-semibold" maxlength="80" placeholder="Например: Тяга Т-грифа">' +
                    '<label class="input-label mt-3" for="custom-group">Группа мышц</label>' +
                    '<select id="custom-group" class="w-full rounded-xl p-3 text-white font-semibold" style="background:rgba(17,24,39,.9);border:1px solid rgba(75,85,99,.6)">' +
                    groupOptions + '</select>',
                actions: [
                    { label: "Отмена", value: null },
                    {
                        label: "Добавить",
                        primary: true,
                        onClick: function (sheet) {
                            const nameInput = sheet.querySelector("#custom-name");
                            const groupInput = sheet.querySelector("#custom-group");
                            const name = nameInput ? nameInput.value.trim() : "";
                            const group = groupInput ? groupInput.value : "ДРУГОЕ";
                            if (!name) {
                                showToast("Введи название упражнения", "error");
                                if (nameInput) nameInput.focus();
                                return false;
                            }
                            const allNames = [];
                            Object.keys(getExerciseGroups()).forEach(function (g) {
                                getExerciseGroups()[g].forEach(function (n) { allNames.push(canonicalName(n)); });
                            });
                            if (allNames.indexOf(canonicalName(name)) !== -1) {
                                showToast("Такое упражнение уже есть", "error");
                                return false;
                            }
                            settings.customExercises = settings.customExercises || [];
                            settings.customExercises.push({ name: name, group: GROUP_COLORS[group] ? group : "ДРУГОЕ" });

                            currentExercise = name;
                            renderExerciseList();
                            syncExerciseSelection();
                            updateLastStatsCard(name);
                            showToast("Упражнение добавлено", "success");

                ]
            });
